<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV EV Detector | Multi-Parking Smart Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#2563EB',
                        ev: '#0284C7',
                        alert: '#DC2626',
                        success: '#16A34A',
                        darkcard: '#1E293B',
                        darkbg: '#0F172A'
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.99); }
        }
        .animate-alert {
            animation: pulse-slow 2s infinite ease-in-out;
        }
        /* Custom smooth scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }
    </style>
</head>
<body x-data="appData()" :class="{ 'dark': isDark }" class="bg-slate-100 text-slate-800 dark:bg-darkbg dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col">

    <!-- Top Navbar -->
    <nav class="bg-white/90 dark:bg-darkcard/90 backdrop-blur-md shadow-sm border-b border-slate-200 dark:border-slate-700/80 sticky top-0 z-40">
        <div class="max-w-[1780px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo & Brand -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                        <i class="fa-solid fa-bolt-lightning text-xl"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white">CCTV EV Detector</span>
                            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">Smart Monitor</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('app_subtitle')"></p>
                    </div>
                </div>

                <!-- Right Menu: Status, Theme, Language Switcher -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <!-- CCTV Active Count Badge -->
                    <div class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs">
                        <span class="w-2 h-2 rounded-full" :class="slots.length > 0 ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'"></span>
                        <span class="text-slate-700 dark:text-slate-300 font-semibold" x-text="slots.length + ' ' + t('cameras_connected')"></span>
                    </div>

                    <!-- Sound Alarm Mute / Unmute Toggle -->
                    <button @click="toggleSound()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition shadow-sm" :title="isMuted ? t('sound_muted') : t('sound_enabled')">
                        <i class="fa-solid" :class="isMuted ? 'fa-volume-xmark text-slate-400' : 'fa-volume-high text-emerald-500'"></i>
                    </button>

                    <!-- Theme Toggle -->
                    <button @click="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition shadow-sm" :title="isDark ? t('theme_light') : t('theme_dark')">
                        <i class="fa-solid" :class="isDark ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'"></i>
                    </button>

                    <!-- Language Switcher (UZ / KO) -->
                    <div class="relative" x-data="{ langOpen: false }">
                        <button @click="langOpen = !langOpen" @click.outside="langOpen = false" class="h-9 px-2.5 flex items-center space-x-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold border border-slate-200 dark:border-slate-700 transition shadow-sm">
                            <span x-text="currentLang === 'uz' ? '🇺🇿 UZ' : '🇰🇷 KO'"></span>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                        </button>

                        <div x-show="langOpen" x-cloak class="absolute right-0 mt-2 w-36 bg-white dark:bg-darkcard rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 py-1 z-50 text-xs">
                            <button @click="setLanguage('uz'); langOpen = false" class="w-full px-3 py-2 text-left flex items-center space-x-2 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition" :class="currentLang === 'uz' ? 'text-blue-600 dark:text-blue-400 font-bold bg-blue-50/50 dark:bg-blue-950/30' : 'text-slate-700 dark:text-slate-300'">
                                <span>🇺🇿</span>
                                <span>O'zbekcha</span>
                            </button>
                            <button @click="setLanguage('ko'); langOpen = false" class="w-full px-3 py-2 text-left flex items-center space-x-2 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition" :class="currentLang === 'ko' ? 'text-blue-600 dark:text-blue-400 font-bold bg-blue-50/50 dark:bg-blue-950/30' : 'text-slate-700 dark:text-slate-300'">
                                <span>🇰🇷</span>
                                <span>한국어</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-[1780px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Top Row: Real-time Statistics Cards (4 Cards) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Total Detections -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="t('stat_total')"></p>
                    <h3 class="text-2xl font-black mt-1 text-slate-900 dark:text-white" x-text="stats.total_detections">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5"><span x-text="t('stat_today')"></span>: <span class="font-bold text-slate-700 dark:text-slate-300" x-text="stats.today_detections">0</span></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 dark:bg-blue-950/60 dark:text-blue-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-car-rear"></i>
                </div>
            </div>

            <!-- EV Detections -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-sky-500" x-text="t('stat_ev')"></p>
                    <h3 class="text-2xl font-black mt-1 text-sky-600 dark:text-sky-400" x-text="stats.ev_count">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5"><span x-text="t('stat_today')"></span>: <span class="font-bold text-sky-600 dark:text-sky-400" x-text="stats.today_ev">0</span></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-600 dark:bg-sky-950/60 dark:text-sky-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-charging-station"></i>
                </div>
            </div>

            <!-- Regular (Non-EV) Vehicles -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" x-text="t('stat_regular')"></p>
                    <h3 class="text-2xl font-black mt-1 text-slate-800 dark:text-slate-200" x-text="stats.regular_count">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5"><span x-text="t('stat_today')"></span>: <span class="font-bold text-slate-700 dark:text-slate-300" x-text="stats.today_regular">0</span></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-gas-pump"></i>
                </div>
            </div>

            <!-- Non-EV Parking Alerts -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between" :class="stats.today_alerts > 0 ? 'border-red-300 dark:border-red-900/50 bg-red-50/20' : ''">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-red-600 dark:text-red-400" x-text="t('stat_alerts')"></p>
                    <h3 class="text-2xl font-black mt-1 text-red-600 dark:text-red-400" x-text="stats.today_alerts">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5" x-text="t('stat_alert_desc')"></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-red-50 text-red-600 dark:bg-red-950/60 dark:text-red-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>
        </div>

        <!-- Middle 2-Column Section: Cameras Configuration & Test Recognition -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">

            <!-- LEFT: Camera Configuration & Live CCTV Slots List -->
            <div class="bg-white dark:bg-darkcard rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 p-5 sm:p-6 h-[400px] flex flex-col">
                <div class="flex items-center justify-between mb-3 shrink-0">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-base shadow-inner">
                            <i class="fa-solid fa-video"></i>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white" x-text="t('camera_mgmt_title')"></h2>
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 flex items-center space-x-1">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span x-text="slots.length + ' ' + t('cameras_connected')"></span>
                                </span>
                            </div>
                            <p class="text-[11px] text-slate-400" x-text="t('camera_mgmt_subtitle')"></p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button @click="openTvWall()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 transition shadow-sm border border-slate-700/50">
                            <i class="fa-solid fa-tv text-amber-400"></i>
                            <span x-text="t('btn_tv_wall')"></span>
                        </button>
                        <button @click="addCamModal = true" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 transition shadow-sm">
                            <i class="fa-solid fa-plus"></i>
                            <span x-text="t('btn_add_camera')"></span>
                        </button>
                    </div>
                </div>

                <!-- Scrollable Container for Mini Live Video Grid -->
                <div class="flex-1 overflow-y-auto pr-1 custom-scrollbar">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <template x-for="slot in slots" :key="slot.camera_id">
                            <div class="rounded-xl border bg-white/80 dark:bg-slate-900/60 overflow-hidden flex flex-col transition duration-200 hover:shadow-md"
                                :class="slot.violation_level === 'danger' ? 'border-rose-400 dark:border-rose-800 shadow-rose-500/10' : (slot.violation_level === 'warning' ? 'border-amber-400 dark:border-amber-800 shadow-amber-500/10' : 'border-slate-200 dark:border-slate-800 hover:border-blue-400 dark:hover:border-blue-500')">
                                
                                <!-- Top Mini Header: Stream Status + Camera Name / Slot + Actions -->
                                <div class="px-2.5 py-1.5 bg-slate-50/90 dark:bg-slate-800/80 border-b border-slate-200/60 dark:border-slate-700/50 flex items-center justify-between gap-1.5 shrink-0">
                                    <div class="flex items-center space-x-1.5 min-w-0">
                                        <div class="flex items-center space-x-1 shrink-0 px-1.5 py-0.5 rounded bg-black/40 text-[9px] font-bold tracking-wider"
                                            :class="slot.is_online ? 'text-emerald-400' : 'text-rose-400'">
                                            <span class="w-1.5 h-1.5 rounded-full" :class="slot.is_online ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'"></span>
                                            <span x-text="slot.is_online ? 'LIVE' : 'OFFLINE'"></span>
                                        </div>
                                        <div class="font-bold text-xs text-slate-800 dark:text-white truncate flex items-center space-x-1">
                                            <span x-text="slot.camera_name || ('CCTV ' + slot.camera_id)"></span>
                                            <span class="text-[10px] text-slate-400 font-mono" x-text="'(' + slot.cs_id + '/' + slot.cp_id + ')'"></span>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-1 shrink-0">
                                        <button @click="openLiveModal(slot)" class="w-6 h-6 rounded-md bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/60 dark:hover:bg-blue-900/60 text-blue-600 dark:text-blue-400 flex items-center justify-center transition" :title="t('btn_zoom_hint')">
                                            <i class="fa-solid fa-expand text-[10px]"></i>
                                        </button>
                                        <button @click="deleteCamera(slot.camera_id)" class="w-6 h-6 rounded-md bg-slate-100 hover:bg-rose-100 dark:bg-slate-800 dark:hover:bg-rose-950/60 text-slate-400 hover:text-rose-500 flex items-center justify-center transition" :title="t('btn_delete')">
                                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Video Stream Display (Click to open full modal) -->
                                <div class="relative bg-black w-full aspect-video min-h-[170px] overflow-hidden group cursor-pointer" @click="openLiveModal(slot)">
                                    <template x-if="slot.is_online">
                                        <img :src="'/api/v1/cameras/' + slot.camera_id + '/live'" 
                                             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                             alt="Live Stream"
                                             loading="lazy" />
                                    </template>
                                    <template x-if="!slot.is_online">
                                        <div class="w-full h-full flex flex-col items-center justify-center text-slate-500 text-xs">
                                            <i class="fa-solid fa-video-slash text-base mb-1 text-slate-600"></i>
                                            <span class="text-[10px]" x-text="t('lbl_signal_lost')"></span>
                                        </div>
                                    </template>


                                    <!-- Glassmorphic HUD Overlay on Bottom of Video (Translucent & Blurred) -->
                                    <template x-if="slot.is_occupied || slot.is_charging || (slot.battery_soc && slot.battery_soc > 0) || slot.connector_status === 'CHARGING' || slot.connector_status === 'PREPARING' || (slot.violation_type && slot.violation_type !== 'NONE' && slot.violation_type !== 'NORMAL_CHARGING')">
                                        <div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/90 via-black/60 to-transparent backdrop-blur-[2px] text-white space-y-1">
                                            <!-- 1. When camera detected vehicle -->
                                            <template x-if="slot.is_occupied">
                                                <div class="space-y-1">
                                                    <div class="flex items-center justify-between">
                                                        <span class="font-mono font-bold px-1.5 py-0.5 rounded text-[11px] shadow"
                                                            :class="slot.is_ev ? 'bg-sky-500 text-white' : 'bg-amber-500 text-slate-950'"
                                                            x-text="(slot.is_ev ? '⚡ ' : '🚗 ') + slot.current_plate"></span>
                                                        <span class="font-mono text-[10px] text-slate-300" x-text="'🅿️ ' + formatDurationDisplay(slot.duration_formatted)"></span>
                                                    </div>

                                                    <!-- Battery SoC (DC) -->
                                                    <template x-if="slot.battery_soc !== null && slot.battery_soc !== undefined && slot.battery_soc > 0">
                                                        <div class="space-y-0.5">
                                                            <div class="flex items-center justify-between text-[10px] font-bold">
                                                                <span class="text-slate-300 flex items-center space-x-1">
                                                                    <i class="fa-solid fa-battery-three-quarters text-emerald-400"></i>
                                                                    <span x-text="t('lbl_battery_soc')"></span>
                                                                </span>
                                                                <span class="font-mono text-emerald-400 font-bold" x-text="slot.battery_soc + '% ' + (slot.charge_power_kw > 0 ? '(' + slot.charge_power_kw + ' kW)' : '')"></span>
                                                            </div>
                                                            <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
                                                                <div class="bg-gradient-to-r from-emerald-400 to-teal-300 h-full rounded-full transition-all duration-500" :style="'width: ' + Math.min(100, Math.max(5, slot.battery_soc)) + '%'"></div>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <!-- AC / DC Charging without SoC -->
                                                    <template x-if="slot.is_charging && (!slot.battery_soc || slot.battery_soc <= 0)">
                                                        <div class="flex items-center justify-between text-[10px] font-bold text-sky-300">
                                                            <span class="flex items-center space-x-1">
                                                                <i class="fa-solid fa-bolt text-amber-400 animate-pulse"></i>
                                                                <span x-text="slot.charge_power_kw > 15 ? t('lbl_dc_charging') : t('lbl_ac_charging')"></span>
                                                            </span>
                                                            <span class="font-mono" x-text="(slot.charge_power_kw || 0) + ' kW' + (slot.charged_energy_kwh > 0 ? ' | ' + slot.charged_energy_kwh + ' kWh' : '')"></span>
                                                        </div>
                                                    </template>

                                                    <!-- Violation Banner -->
                                                    <template x-if="slot.violation_type !== 'NORMAL_CHARGING' && slot.violation_type !== 'NONE' && slot.violation_type !== 'PREPARING'">
                                                        <div class="px-1.5 py-0.5 rounded text-[10px] font-bold flex items-center space-x-1 truncate shadow"
                                                            :class="slot.violation_level === 'danger' ? 'bg-rose-600 text-white' : 'bg-amber-500 text-slate-950'">
                                                            <i class="fa-solid fa-triangle-exclamation text-[9px] shrink-0"></i>
                                                            <span class="truncate" x-text="getViolationLabel(slot)"></span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- 2. When camera did NOT detect vehicle, but DB says charging -->
                                            <template x-if="!slot.is_occupied && (slot.is_charging || slot.connector_status === 'CHARGING')">
                                                <div class="space-y-1">
                                                    <template x-if="slot.battery_soc !== null && slot.battery_soc !== undefined && slot.battery_soc > 0">
                                                        <div class="space-y-0.5">
                                                            <div class="flex items-center justify-between text-[10px] font-bold">
                                                                <span class="text-slate-300 flex items-center space-x-1">
                                                                    <i class="fa-solid fa-battery-three-quarters text-emerald-400"></i>
                                                                    <span x-text="t('lbl_battery_soc')"></span>
                                                                </span>
                                                                <span class="font-mono text-emerald-400 font-bold" x-text="slot.battery_soc + '% ' + (slot.charge_power_kw > 0 ? '(' + slot.charge_power_kw + ' kW)' : '')"></span>
                                                            </div>
                                                            <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
                                                                <div class="bg-gradient-to-r from-emerald-400 to-teal-300 h-full rounded-full transition-all duration-500" :style="'width: ' + Math.min(100, Math.max(5, slot.battery_soc)) + '%'"></div>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    
                                                    <!-- Soft Semi-transparent Pill -->
                                                    <div class="flex items-center justify-between px-2 py-0.5 rounded bg-black/40 border border-white/10 text-[10px]">
                                                        <span class="flex items-center space-x-1 text-slate-200 font-medium">
                                                            <i class="fa-solid fa-bolt text-amber-400"></i>
                                                            <span x-text="slot.is_charging ? (slot.charge_power_kw > 15 ? t('lbl_dc_charging') : t('lbl_ac_charging')) : t('slot_charging_desc')"></span>
                                                        </span>
                                                        <span class="font-mono font-bold text-emerald-400" x-text="slot.charging_duration_formatted ? '⏱️ ' + formatDurationDisplay(slot.charging_duration_formatted) : getConnectorLabel(slot)"></span>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- 3. When camera did NOT detect vehicle, cable preparing -->
                                            <template x-if="!slot.is_occupied && !slot.is_charging && slot.connector_status === 'PREPARING'">
                                                <div class="flex items-center justify-between px-2 py-0.5 rounded bg-amber-950/70 border border-amber-500/40 text-[10px] text-amber-300 font-medium">
                                                    <span class="flex items-center space-x-1">
                                                        <i class="fa-solid fa-plug text-amber-400"></i>
                                                        <span x-text="t('slot_cable_connected')"></span>
                                                    </span>
                                                    <span class="font-mono text-[10px] font-bold" x-text="getConnectorLabel(slot)"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Hover Expand Hint Icon -->
                                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                                        <div class="w-7 h-7 rounded-full bg-black/70 text-white flex items-center justify-center shadow-lg transform group-hover:scale-110 transition-transform">
                                            <i class="fa-solid fa-up-right-and-down-left-from-center text-xs"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <template x-if="slots.length === 0">
                        <div class="text-center py-14 text-slate-400 text-xs">
                            <div class="w-12 h-12 mx-auto mb-2 rounded-2xl bg-blue-50 dark:bg-blue-950/50 text-blue-500 flex items-center justify-center text-xl shadow-inner">
                                <i class="fa-solid fa-video"></i>
                            </div>
                            <p class="font-bold" x-text="t('no_cameras_msg')"></p>
                            <button @click="addCamModal = true" class="mt-3 px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-sm transition">
                                <i class="fa-solid fa-plus mr-1"></i> <span x-text="t('btn_add_camera')"></span>
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- RIGHT: Test Upload & Recognition Box (Matched Height) -->
            <div class="bg-white dark:bg-darkcard p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 h-[400px] flex flex-col">
                <div class="flex items-center justify-between mb-3 shrink-0">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-base shadow-inner">
                            <i class="fa-solid fa-file-arrow-up"></i>
                        </div>
                        <div>
                            <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white" x-text="t('test_title')"></h2>
                            <p class="text-[11px] text-slate-400" x-text="t('korean_plates_support')"></p>
                        </div>
                    </div>
                </div>

                <!-- Drag & Drop Box + Inline Detection Result -->
                <div class="flex-1 flex flex-col overflow-y-auto pr-1.5 custom-scrollbar">
                    <!-- Dropzone -->
                    <div 
                        class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-4 text-center hover:bg-slate-50 dark:hover:bg-slate-800/60 transition cursor-pointer relative flex-1 flex flex-col items-center justify-center min-h-[140px]"
                        @dragover.prevent="dragOver = true"
                        @dragleave.prevent="dragOver = false"
                        @drop.prevent="handleDrop($event)"
                        :class="dragOver ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-950/30' : ''"
                        @click="$refs.fileInput.click()"
                    >
                        <input type="file" x-ref="fileInput" class="hidden" accept="image/*" @change="handleFileSelect($event)">
                        
                        <div x-show="!isUploading">
                            <div class="w-10 h-10 mx-auto rounded-2xl bg-indigo-50 dark:bg-slate-800 flex items-center justify-center text-indigo-600 dark:text-indigo-400 mb-2 text-lg">
                                <i class="fa-regular fa-image"></i>
                            </div>
                            <p class="text-xs font-bold text-slate-700 dark:text-slate-200" x-text="t('dropzone_prompt')"></p>
                            <p class="text-[10px] text-slate-400 mt-0.5" x-text="t('dropzone_formats')"></p>
                        </div>
                        
                        <div x-show="isUploading" class="py-3 flex flex-col items-center justify-center space-y-2">
                            <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-600"></i>
                            <p class="text-xs font-bold text-slate-700 dark:text-slate-200" x-text="t('analyzing_title')"></p>
                            <p class="text-[10px] text-slate-400" x-text="t('analyzing_desc')"></p>
                        </div>
                    </div>

                    <!-- Detection Live Result Card (Inline) -->
                    <div x-show="uploadResult" x-cloak class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold text-slate-900 dark:text-white flex items-center">
                                <i class="fa-solid fa-circle-check mr-1.5 text-emerald-500"></i> <span x-text="t('result_title')"></span>
                            </h3>
                            <span class="text-[10px] font-mono text-slate-400" x-text="uploadResult ? (uploadResult.processing_time_ms + ' ms') : ''"></span>
                        </div>

                        <!-- SUCCESS RESULT -->
                        <template x-if="uploadResult && uploadResult.success && uploadResult.data">
                            <div class="p-3 rounded-xl border flex items-center justify-between gap-2"
                                :class="uploadResult.data.is_ev ? 'bg-sky-50/60 dark:bg-sky-950/30 border-sky-300 dark:border-sky-800' : 'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700'">
                                <div class="flex items-center space-x-3">
                                    <span class="text-2xl" x-text="uploadResult.data.is_ev ? '⚡' : '🚗'"></span>
                                    <div>
                                        <div class="font-mono font-black text-sm text-slate-900 dark:text-white" x-text="uploadResult.data.plate_number"></div>
                                        <span class="text-[11px] font-bold" :class="uploadResult.data.is_ev ? 'text-sky-500' : 'text-slate-500'" x-text="uploadResult.data.is_ev ? t('result_ev_confirmed') : t('result_regular_car')"></span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs font-mono font-bold text-slate-600 dark:text-slate-300" x-text="((uploadResult.data.confidence || 0) * 100).toFixed(0) + '%'"></span>
                                </div>
                            </div>
                        </template>

                        <!-- ERROR / UNRECOGNIZED RESULT -->
                        <template x-if="uploadResult && !uploadResult.success">
                            <div class="p-3 rounded-xl border border-rose-200 dark:border-rose-900 bg-rose-50/60 dark:bg-rose-950/20 flex items-center space-x-2 text-rose-700 dark:text-rose-400 text-xs">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                                <span x-text="uploadResult.message || 'Raqam aniqlanmadi'"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM FULL-WIDTH SECTION: Aniqlangan mashinalar jurnali (Events Table) -->
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            <div class="p-5 border-b border-slate-100 dark:border-slate-800/80 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-sm font-bold shadow-inner">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('history_title')"></h2>
                        <p class="text-xs text-slate-400 dark:text-slate-500" x-text="t('history_subtitle')"></p>
                    </div>
                </div>
                
                <!-- Center & Right: Date Range Filter + Export CSV + Type Filter + Refresh -->
                <div class="flex flex-wrap items-center gap-2.5 w-full xl:w-auto justify-start xl:justify-end">
                    <!-- Date Range Box (Default Today) -->
                    <div class="flex items-center space-x-1.5 bg-slate-50 dark:bg-slate-800/80 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div class="flex items-center space-x-1 text-slate-500 dark:text-slate-400 px-1 text-xs">
                            <i class="fa-regular fa-calendar text-blue-500"></i>
                            <span class="text-[10px] font-bold uppercase hidden sm:inline" x-text="t('lbl_date_range')"></span>
                        </div>
                        <input type="date" x-model="filters.startDate" @change="page = 1; fetchVehicles()" class="text-xs px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 font-mono font-semibold focus:ring-1 focus:ring-blue-500 outline-none transition cursor-pointer">
                        <span class="text-slate-400 text-xs font-bold">-</span>
                        <input type="date" x-model="filters.endDate" @change="page = 1; fetchVehicles()" class="text-xs px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 font-mono font-semibold focus:ring-1 focus:ring-blue-500 outline-none transition cursor-pointer">
                    </div>

                    <!-- Excel / CSV Export Button -->
                    <button @click="exportCSV()" class="h-9 px-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 transition shadow-sm" :title="t('btn_export_csv')">
                        <i class="fa-solid fa-file-excel text-sm"></i>
                        <span x-text="t('btn_export_csv')"></span>
                    </button>

                    <!-- Type & Violation Filter Select -->
                    <select x-model="filters.type" @change="page = 1; fetchVehicles()" class="h-9 text-xs px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold focus:ring-2 focus:ring-blue-500 outline-none transition cursor-pointer">
                        <option value="" x-text="t('filter_all')"></option>
                        <option value="NON_EV" x-text="t('filter_non_ev')"></option>
                        <option value="NOT_CHARGING" x-text="t('filter_not_charging')"></option>
                        <option value="OVERSTAY" x-text="t('filter_overstay')"></option>
                        <option value="EV" x-text="t('filter_ev_only')"></option>
                        <option value="REGULAR" x-text="t('filter_regular_only')"></option>
                    </select>

                    <!-- Refresh Button -->
                    <button @click="refreshAll()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition shadow-sm" :title="t('btn_refresh')">
                        <i class="fa-solid fa-rotate-right text-xs" :class="{ 'fa-spin': isRefreshing }"></i>
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="w-full overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse min-w-[960px]">
                    <thead class="bg-slate-50/80 dark:bg-slate-800/40 text-slate-400 dark:text-slate-500 border-b border-slate-100 dark:border-slate-800 uppercase tracking-wider text-[10px] font-bold">
                        <tr>
                            <th class="px-4 py-3.5" x-text="t('th_time')"></th>
                            <th class="px-4 py-3.5" x-text="t('th_charger_id')"></th>
                            <th class="px-4 py-3.5" x-text="t('th_cctv_name')"></th>
                            <th class="px-4 py-3.5" x-text="t('th_plate')"></th>
                            <th class="px-4 py-3.5" x-text="t('th_type')"></th>
                            <th class="px-4 py-3.5" x-text="t('th_battery')"></th>
                            <th class="px-4 py-3.5" x-text="t('th_violation')"></th>
                            <th class="px-4 py-3.5" x-text="t('th_action')"></th>
                            <th class="px-4 py-3.5 text-right" x-text="t('th_actions')"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-slate-800/60">
                        <template x-for="item in vehicles" :key="item.id">
                            <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/30 transition duration-150"
                                :class="{'bg-rose-50/40 dark:bg-rose-950/20': item.violation_type === 'NON_EV_PARKED' || item.violation_type === 'OVERSTAY', 'bg-amber-50/30 dark:bg-amber-950/10': item.violation_type === 'NOT_CHARGING'}">
                                <!-- 1. Time & Note -->
                                <td class="px-4 py-3 whitespace-nowrap">
                                    <div class="font-mono font-bold text-slate-800 dark:text-slate-200 text-xs" x-text="formatDate(item.created_at)"></div>
                                    <div class="mt-0.5 text-[10px] font-medium text-slate-400 dark:text-slate-500" x-text="formatNote(item)"></div>
                                </td>
                                <!-- 2. Charger ID -->
                                <td class="px-4 py-3 whitespace-nowrap">
                                    <span class="font-mono font-bold text-blue-600 dark:text-blue-400 text-xs" x-text="item.cp_id || 'BNS00000'"></span>
                                </td>
                                <!-- 3. CCTV Name -->
                                <td class="px-4 py-3 whitespace-nowrap">
                                    <span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono font-bold text-slate-700 dark:text-slate-300 text-xs whitespace-nowrap" x-text="item.camera_name || 'CCTV 1'"></span>
                                </td>
                                <!-- 4. License Plate & Event Tag -->
                                <td class="px-4 py-3 whitespace-nowrap">
                                    <div class="inline-flex items-center space-x-2">
                                        <div class="px-2.5 py-1 rounded-xl border font-mono font-extrabold tracking-wider text-xs shadow-sm inline-flex items-center space-x-1"
                                             :class="item.is_ev ? 'bg-sky-50 dark:bg-sky-950/50 border-sky-300 dark:border-sky-800 text-sky-900 dark:text-sky-300' : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100'">
                                            <span x-show="item.is_ev" class="text-sky-500 text-xs">⚡</span>
                                            <span x-text="item.plate_number || t('unrecognized')"></span>
                                        </div>
                                        <template x-if="item.event_type === 'START'">
                                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300" x-text="t('event_start')"></span>
                                        </template>
                                        <template x-if="item.event_type === 'END'">
                                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300" x-text="t('event_end')"></span>
                                        </template>
                                    </div>
                                </td>
                                <!-- 5. Vehicle Type -->
                                <td class="px-4 py-3 whitespace-nowrap">
                                    <template x-if="item.is_ev">
                                        <span class="inline-flex items-center px-2 py-0.5 rounded-lg text-xs font-bold bg-sky-500/10 text-sky-700 dark:text-sky-300 border border-sky-300/40 dark:border-sky-700/40">
                                            <i class="fa-solid fa-bolt mr-1 text-sky-500 text-[10px]"></i> <span x-text="t('vehicle_ev')"></span>
                                        </span>
                                    </template>
                                    <template x-if="!item.is_ev">
                                        <span class="inline-flex items-center px-2 py-0.5 rounded-lg text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                                            <i class="fa-solid fa-car mr-1 text-slate-400 text-[10px]"></i> <span x-text="t('vehicle_regular')"></span>
                                        </span>
                                    </template>
                                </td>
                                <!-- 6. Battery & Charging -->
                                <td class="px-4 py-3 whitespace-nowrap">
                                    <template x-if="item.battery_soc !== null && item.battery_soc !== undefined && item.battery_soc > 0">
                                        <div>
                                            <template x-if="item.battery_soc >= 100">
                                                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300" x-text="'🟢 ' + t('battery_full')"></span>
                                            </template>
                                            <template x-if="item.battery_soc < 100">
                                                <span class="font-mono font-bold text-xs text-sky-600 dark:text-sky-400 flex items-center space-x-1">
                                                    <i class="fa-solid fa-bolt text-sky-500 text-[10px]"></i>
                                                    <span x-text="item.battery_soc + '%'"></span>
                                                    <span class="text-[10px] text-slate-400 font-normal" x-show="item.charge_power_kw" x-text="'(' + item.charge_power_kw + ' kW)'"></span>
                                                </span>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="(!item.battery_soc || item.battery_soc <= 0) && item.charge_power_kw > 0">
                                        <span class="font-mono font-bold text-xs text-sky-600 dark:text-sky-400 flex items-center space-x-1">
                                            <i class="fa-solid fa-bolt text-sky-500 text-[10px] animate-pulse"></i>
                                            <span x-text="item.charge_power_kw + ' kW'"></span>
                                        </span>
                                    </template>
                                    <template x-if="(!item.battery_soc || item.battery_soc <= 0) && (!item.charge_power_kw || item.charge_power_kw <= 0)">
                                        <span class="text-slate-400 font-mono text-xs">—</span>
                                    </template>
                                </td>
                                <!-- 7. Violation Status -->
                                <td class="px-4 py-3 whitespace-nowrap">
                                    <template x-if="item.violation_type === 'NON_EV_PARKED'">
                                        <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-300/50 flex items-center space-x-1 w-fit">
                                            <span>🚨</span>
                                            <span x-text="getViolationLabel(item)"></span>
                                        </span>
                                    </template>
                                    <template x-if="item.violation_type === 'NOT_CHARGING'">
                                        <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border border-amber-300/50 flex items-center space-x-1 w-fit">
                                            <span>⚠️</span>
                                            <span x-text="getViolationLabel(item)"></span>
                                        </span>
                                    </template>
                                    <template x-if="item.violation_type === 'OVERSTAY'">
                                        <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-red-100 text-red-800 dark:bg-red-950/60 dark:text-red-300 border border-red-300/50 flex items-center space-x-1 w-fit">
                                            <span>🛑</span>
                                            <span x-text="getViolationLabel(item)"></span>
                                        </span>
                                    </template>
                                    <template x-if="item.violation_type !== 'NON_EV_PARKED' && item.violation_type !== 'NOT_CHARGING' && item.violation_type !== 'OVERSTAY'">
                                        <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-300/50 flex items-center space-x-1 w-fit">
                                            <span>🟢</span>
                                            <span x-text="getViolationLabel(item)"></span>
                                        </span>
                                    </template>
                                </td>
                                <!-- 8. Action Required / Alert -->
                                <td class="px-4 py-3 whitespace-nowrap">
                                    <span class="font-bold text-xs"
                                          :class="item.violation_type === 'NON_EV_PARKED' || item.violation_type === 'OVERSTAY' ? 'text-rose-600 dark:text-rose-400 font-extrabold' : (item.violation_type === 'NOT_CHARGING' ? 'text-amber-600 dark:text-amber-400 font-bold' : 'text-slate-400')"
                                          x-text="getActionLabel(item)">
                                    </span>
                                </td>
                                <!-- 9. Actions -->
                                <td class="px-4 py-3 text-right whitespace-nowrap space-x-1.5">
                                    <button @click="openImageModal(item.image_url)" class="w-7 h-7 inline-flex items-center justify-center rounded-lg bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/40 dark:hover:bg-blue-900/60 text-blue-600 dark:text-blue-400 transition shadow-sm" :title="t('view_image')">
                                        <i class="fa-solid fa-image text-xs"></i>
                                    </button>
                                    <button @click="deleteVehicle(item.id)" class="w-7 h-7 inline-flex items-center justify-center rounded-lg bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/60 text-rose-500 dark:text-rose-400 transition shadow-sm" :title="t('btn_delete')">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </td>
                            </tr>
                        </template>
                        <template x-if="vehicles.length === 0">
                            <tr>
                                <td colspan="9" class="px-6 py-12 text-center text-slate-400">
                                    <p class="text-xs font-semibold" x-text="t('no_history_msg')"></p>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="p-4 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/60 dark:bg-slate-800/30 text-xs" x-show="totalPages > 1">
                <button @click="prevPage()" :disabled="page === 1" class="px-3.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 disabled:opacity-40 font-bold text-slate-700 dark:text-slate-200 transition" x-text="t('btn_prev')"></button>
                <span class="text-slate-500 font-mono text-xs font-semibold"><span class="font-bold text-slate-800 dark:text-slate-100" x-text="page"></span> / <span x-text="totalPages"></span> <span x-text="t('page_label')"></span></span>
                <button @click="nextPage()" :disabled="page === totalPages" class="px-3.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 disabled:opacity-40 font-bold text-slate-700 dark:text-slate-200 transition" x-text="t('btn_next')"></button>
            </div>
        </div>
    </main>

    <!-- MODAL 1: ADD CAMERA / PARKING SLOT -->
    <div x-show="addCamModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-2xl max-w-xl w-full p-6 border border-slate-200 dark:border-slate-700 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar" @click.outside="addCamModal = false">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 flex items-center justify-center text-sm">
                        <i class="fa-solid fa-video"></i>
                    </div>
                    <h3 class="font-bold text-base text-slate-900 dark:text-white" x-text="t('add_camera_header')"></h3>
                </div>
                <button @click="addCamModal = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <!-- Form -->
            <div class="space-y-3.5 text-xs" x-data="{ showAdvanced: false, showPass: false }">
                <!-- Station & Slot Inputs -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('station_id_label')"></label>
                        <input type="text" x-model="newCam.cs_id" placeholder="bluenetwrks" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-mono">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('slot_id_label')"></label>
                        <input type="text" x-model="newCam.cp_id" placeholder="BNS00000" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-mono">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('cam_name_label')"></label>
                    <input type="text" x-model="newCam.camera_name" :placeholder="t('cam_name_ph')" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                </div>

                <!-- CCTV Brand / Vendor Preset Selector -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('lbl_brand_preset')"></label>
                        <select x-model="newCam.brand" @change="onBrandChange()" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-semibold cursor-pointer">
                            <option value="auto" x-text="t('preset_auto')"></option>
                            <option value="hikvision">하이크비전 (Hikvision / Ezviz)</option>
                            <option value="dahua">다화 (Dahua / Imou)</option>
                            <option value="hanwha">한화테크윈 (Hanwha / Samsung)</option>
                            <option value="uniview">유니뷰 (Uniview / UNV)</option>
                            <option value="tplink">티피링크 (TP-Link Tapo / Vigi)</option>
                            <option value="axis">엑시스 (Axis Communications)</option>
                            <option value="generic">일반 표준 RTSP (Generic)</option>
                            <option value="http">HTTP 스냅샷 (Snapshot API)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('lbl_camera_protocol')"></label>
                        <select x-model="newCam.camera_type" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-semibold cursor-pointer">
                            <option value="RTSP">RTSP (Real-Time Stream)</option>
                            <option value="HTTP_SNAPSHOT">HTTP Snapshot (JPEG)</option>
                            <option value="ONVIF">ONVIF (Standard IP Cam)</option>
                        </select>
                    </div>
                </div>

                <!-- IP Address & Port -->
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('cam_ip_label')"></label>
                        <input type="text" x-model="newCam.ip_address" placeholder="192.168.0.16" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-mono">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('cam_port_label')"></label>
                        <input type="number" x-model.number="newCam.port" placeholder="554" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-mono">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('cam_user_label')"></label>
                        <input type="text" x-model="newCam.username" placeholder="admin" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('cam_pass_label')"></label>
                        <div class="relative">
                            <input :type="showPass ? 'text' : 'password'" x-model="newCam.password" placeholder="••••••••" class="w-full p-2 pr-8 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                            <button type="button" @click="showPass = !showPass" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                <i class="fa-solid text-xs" :class="showPass ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Advanced URL toggle -->
                <div>
                    <button type="button" @click="showAdvanced = !showAdvanced" class="text-[11px] text-slate-500 hover:text-blue-600 flex items-center space-x-1">
                        <i class="fa-solid text-[9px]" :class="showAdvanced ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                        <span x-text="t('advanced_url_toggle')"></span>
                    </button>
                    <div x-show="showAdvanced" class="mt-1.5 space-y-1">
                        <input type="text" x-model="newCam.stream_url" placeholder="rtsp://192.168.0.16:554/Streaming/Channels/101" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-mono">
                    </div>
                </div>

                <!-- Test Connection (Probe) Button & Live Probe Result Box -->
                <div class="pt-1">
                    <button type="button" @click="testProbeCamera()" :disabled="isProbingCam || (!newCam.ip_address && !newCam.stream_url)" class="w-full py-2 px-3 rounded-xl border border-blue-200 dark:border-blue-900/60 bg-blue-50/70 hover:bg-blue-100/70 dark:bg-blue-950/40 dark:hover:bg-blue-900/50 text-blue-700 dark:text-blue-300 font-bold text-xs flex items-center justify-center space-x-1.5 transition disabled:opacity-50">
                        <i class="fa-solid" :class="isProbingCam ? 'fa-circle-notch fa-spin' : 'fa-plug-circle-check'"></i>
                        <span x-text="isProbingCam ? t('testing_connection') : t('btn_test_connection')"></span>
                    </button>

                    <!-- Probe Result Preview -->
                    <div x-show="probeResult" x-cloak class="mt-2.5 p-3 rounded-xl border space-y-2"
                        :class="probeResult && probeResult.success ? 'bg-emerald-50/80 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300' : 'bg-rose-50/80 dark:bg-rose-950/30 border-rose-300 dark:border-rose-800 text-rose-800 dark:text-rose-300'">
                        <div class="flex items-center space-x-2 font-bold text-xs">
                            <i class="fa-solid" :class="probeResult && probeResult.success ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'"></i>
                            <span x-text="probeResult ? probeResult.message : ''"></span>
                        </div>
                        <template x-if="probeResult && probeResult.image_base64">
                            <div class="mt-2 rounded-lg overflow-hidden border border-emerald-400/40 max-h-40 bg-black aspect-video flex items-center justify-center">
                                <img :src="'data:image/jpeg;base64,' + probeResult.image_base64" class="max-h-40 w-full object-contain" alt="Live Camera Preview" />
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Force Save Option -->
                <div class="pt-1 flex items-center space-x-2 text-slate-600 dark:text-slate-300">
                    <input type="checkbox" id="force_save_cb" x-model="newCam.force_save" class="rounded border-slate-300 dark:border-slate-600 text-blue-600 focus:ring-blue-500 cursor-pointer">
                    <label for="force_save_cb" class="text-[11px] cursor-pointer" x-text="currentLang === 'uz' ? 'Hozircha offline bo\'lsa ham kamerani saqlash' : '현재 오프라인 상태여도 카메라 등록 저장'"></label>
                </div>
            </div>

            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex justify-end space-x-2">
                <button @click="addCamModal = false" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs" x-text="t('btn_close')"></button>
                <button @click="createCamera()" :disabled="isSavingCam || (!newCam.ip_address && !newCam.stream_url)" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white rounded-xl text-xs font-bold transition flex items-center space-x-1.5">
                    <span x-show="!isSavingCam" x-text="t('btn_save_camera')"></span>
                    <span x-show="isSavingCam" class="flex items-center space-x-1">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <span x-text="t('connecting_status')"></span>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: CCTV LIVE VIDEO EXPANDED VIEWER & AI SCAN -->
    <div x-show="liveModal.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-md">
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-2xl max-w-4xl w-full p-5 sm:p-6 border border-slate-200 dark:border-slate-700 space-y-4">
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-red-100 text-red-600 dark:bg-red-950/60 dark:text-red-400 flex items-center justify-center text-sm">
                        <i class="fa-solid fa-video"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h3 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white" x-text="(liveModal.slot?.cs_id || '') + ' - ' + (liveModal.slot?.cp_id || '') + ' (' + (liveModal.slot?.camera_name || t('unnamed_camera')) + ')'"></h3>
                            <span class="inline-flex items-center space-x-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-500 text-white uppercase tracking-wider">
                                <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                                <span>LIVE</span>
                            </span>
                        </div>
                        <p class="text-[11px] font-mono text-slate-400" x-text="liveModal.slot?.stream_url"></p>
                    </div>
                </div>
                <button @click="closeLiveModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-600 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            
            <!-- Video Stream Player -->
            <div class="relative rounded-2xl overflow-hidden bg-black aspect-video flex items-center justify-center border border-slate-800 shadow-inner">
                <template x-if="liveModal.open && liveModal.slot">
                    <img :src="'/api/v1/cameras/' + liveModal.slot.camera_id + '/live'" class="w-full h-full object-contain" alt="Live CCTV Video">
                </template>
            </div>

            <!-- Instant AI Scan Result Panel -->
            <template x-if="liveModal.aiResult">
                <div class="p-3.5 rounded-xl border flex items-center justify-between gap-3"
                    :class="liveModal.aiResult.is_ev ? 'bg-sky-50 dark:bg-sky-950/30 border-sky-300 dark:border-sky-800' : (liveModal.aiResult.success ? 'bg-rose-50 dark:bg-rose-950/30 border-rose-300 dark:border-rose-800' : 'bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700')">
                    <div class="flex items-center space-x-3">
                        <div class="text-2xl" x-text="liveModal.aiResult.is_ev ? '⚡' : (liveModal.aiResult.success ? '🚨' : '❓')"></div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm font-black tracking-wider text-slate-900 dark:text-white" x-text="liveModal.aiResult.plate_number || t('unrecognized')"></span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold" :class="liveModal.aiResult.is_ev ? 'bg-sky-500 text-white' : 'bg-rose-500 text-white'" x-text="liveModal.aiResult.is_ev ? t('result_ev_confirmed') : t('result_regular_car')"></span>
                            </div>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400" x-text="liveModal.aiResult.is_ev ? t('result_ev_allowed') : (liveModal.aiResult.success ? t('result_alert_illegal') : t('result_unrecognized'))"></p>
                        </div>
                    </div>
                    <div class="text-right" x-show="liveModal.aiResult.success">
                        <span class="text-xs font-mono font-bold text-slate-600 dark:text-slate-300" x-text="((liveModal.aiResult.confidence || 0) * 100).toFixed(0) + '% ' + t('confidence_text')"></span>
                    </div>
                </div>
            </template>

            <!-- Modal Action Buttons -->
            <div class="flex items-center justify-between pt-2">
                <button @click="scanLiveFrame()" :disabled="liveModal.aiLoading" class="px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 disabled:opacity-50 text-white rounded-xl text-xs font-bold flex items-center space-x-2 shadow-sm transition">
                    <i class="fa-solid" :class="liveModal.aiLoading ? 'fa-circle-notch fa-spin' : 'fa-wand-magic-sparkles'"></i>
                    <span x-text="liveModal.aiLoading ? t('analyzing_ai') : t('btn_ai_scan_now')"></span>
                </button>
                <button @click="closeLiveModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition" x-text="t('btn_close')"></button>
            </div>
        </div>
    </div>

    <!-- MODAL 3: Image Fullscreen Preview -->
    <div x-show="previewImage.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="relative max-w-4xl w-full">
            <button @click="previewImage.open = false" class="absolute -top-10 right-0 text-white text-2xl hover:text-slate-300">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img :src="previewImage.url" class="w-full h-auto max-h-[85vh] object-contain rounded-2xl shadow-2xl border border-white/10" alt="Full Image Preview">
        </div>
    </div>

    <!-- MODAL 4: TV WALL / MULTI-VIEW FULLSCREEN MONITORING -->
    <div x-show="tvWallModal" 
         x-cloak 
         @keydown.window.escape="if (tvWallModal) closeTvWall()"
         class="fixed inset-0 z-[100] bg-slate-950 text-white flex flex-col overflow-hidden select-none">
        
        <!-- TV Wall Top Control Bar -->
        <header class="h-12 sm:h-14 bg-slate-900/95 border-b border-slate-800/80 px-3 sm:px-6 flex items-center justify-between shrink-0 shadow-lg backdrop-blur-md">
            <!-- Left: System Brand & Live Indicator -->
            <div class="flex items-center space-x-3 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-blue-600/30 border border-blue-500/40 text-blue-400 flex items-center justify-center text-sm shadow-inner shrink-0">
                    <i class="fa-solid fa-tv"></i>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center space-x-2">
                        <h2 class="text-xs sm:text-sm font-extrabold text-white tracking-wide truncate" x-text="t('tv_wall_title')"></h2>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center space-x-1 shrink-0">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                            <span x-text="slots.length + ' ' + t('cameras_connected')"></span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Center: High-Precision Live Clock -->
            <div class="hidden md:flex items-center space-x-2 bg-slate-950/80 px-4 py-1 rounded-xl border border-slate-800 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-mono font-bold text-slate-300 tracking-wider" x-text="tvClock"></span>
            </div>

            <!-- Right Controls: Fullscreen Toggle & Exit -->
            <div class="flex items-center space-x-2 shrink-0">
                <button @click="toggleTvFullscreen()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold flex items-center space-x-1.5 transition cursor-pointer">
                    <i class="fa-solid" :class="isTvFullscreen ? 'fa-compress' : 'fa-expand'"></i>
                    <span class="hidden sm:inline" x-text="t('btn_fullscreen')"></span>
                </button>
                <button @click="closeTvWall()" class="px-3.5 py-1.5 rounded-xl bg-rose-600/80 hover:bg-rose-600 text-white text-xs font-bold flex items-center space-x-1.5 transition shadow-sm cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                    <span x-text="t('btn_exit_tv')"></span>
                </button>
            </div>
        </header>

        <!-- TV Wall Dynamic CCTV Grid Area (100% Screen Height & Width Responsive) -->
        <main class="flex-1 p-2 sm:p-3.5 bg-black overflow-hidden flex flex-col justify-center items-center">
            <!-- No Cameras Connected State -->
            <template x-if="!slots || slots.length === 0">
                <div class="flex flex-col items-center justify-center text-slate-500 space-y-3">
                    <i class="fa-solid fa-video-slash text-5xl text-slate-700 animate-pulse"></i>
                    <p class="text-sm font-semibold" x-text="t('no_cameras_msg')"></p>
                </div>
            </template>

            <!-- Dynamic Camera Grid -->
            <div x-show="slots && slots.length > 0" class="w-full h-full" :class="getTvGridClass()">
                <template x-for="slot in slots" :key="slot.camera_id">
                    <div class="relative w-full h-full rounded-2xl overflow-hidden bg-slate-950 border flex flex-col justify-between transition-all duration-300 shadow-2xl group"
                         :class="slot.violation_level === 'danger' ? 'border-rose-500 shadow-rose-900/30' : (slot.violation_level === 'warning' ? 'border-amber-500 shadow-amber-900/30' : 'border-slate-800 hover:border-blue-500/60')">
                        
                        <!-- Top HUD Bar inside Tile -->
                        <div class="absolute top-0 left-0 right-0 z-20 px-3 py-2 bg-gradient-to-b from-black/90 via-black/50 to-transparent flex items-center justify-between pointer-events-none">
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 rounded bg-black/60 backdrop-blur-md border border-white/10 text-[11px] font-black text-white flex items-center space-x-1.5">
                                    <span class="w-2 h-2 rounded-full" :class="slot.is_online ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'"></span>
                                    <span x-text="slot.camera_name || ('CCTV ' + slot.camera_id)"></span>
                                </span>
                                <span class="px-2 py-0.5 rounded bg-blue-950/80 border border-blue-500/30 text-[10px] font-mono font-bold text-blue-300" x-text="slot.cs_id + ' / ' + slot.cp_id"></span>
                            </div>

                            <!-- Violation or Status Badge -->
                            <div class="flex items-center space-x-1.5">
                                <template x-if="slot.violation_type === 'NON_EV_PARKED'">
                                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-rose-500 text-white shadow-lg animate-bounce flex items-center space-x-1">
                                        <span>🚨</span>
                                        <span x-text="getViolationLabel(slot)"></span>
                                    </span>
                                </template>
                                <template x-if="slot.violation_type === 'NOT_CHARGING'">
                                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-amber-500 text-white shadow-lg flex items-center space-x-1">
                                        <span>⚠️</span>
                                        <span x-text="getViolationLabel(slot)"></span>
                                    </span>
                                </template>
                                <template x-if="slot.violation_type === 'OVERSTAY'">
                                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-red-600 text-white shadow-lg flex items-center space-x-1">
                                        <span>🛑</span>
                                        <span x-text="getViolationLabel(slot)"></span>
                                    </span>
                                </template>
                                <template x-if="slot.is_occupied && slot.is_ev && (slot.violation_type === 'NONE' || slot.violation_type === 'NORMAL_CHARGING')">
                                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-emerald-500 text-white shadow-md flex items-center space-x-1">
                                        <span>🟢</span>
                                        <span x-text="getViolationLabel(slot)"></span>
                                    </span>
                                </template>
                            </div>
                        </div>

                        <!-- Video Stream Canvas / Frame -->
