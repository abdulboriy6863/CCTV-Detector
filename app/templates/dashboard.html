<!DOCTYPE html>
<html lang="ko" x-data="appData()" :class="{ 'dark': isDark }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV EV Detector | Multi-Parking Smart Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#2563EB',
                        ev: '#0284C7',
                        alert: '#DC2626',
                        success: '#16A34A',
                        darkcard: '#1E293B',
                        darkbg: '#0F172A'
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.99); }
        }
        .animate-alert {
            animation: pulse-slow 2s infinite ease-in-out;
        }
        /* Custom smooth scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkbg dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col">

    <!-- Top Navbar -->
    <nav class="bg-white/90 dark:bg-darkcard/90 backdrop-blur-md shadow-sm border-b border-slate-200 dark:border-slate-700/80 sticky top-0 z-40">
        <div class="max-w-[1780px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo & Brand -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                        <i class="fa-solid fa-bolt-lightning text-xl"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white">CCTV EV Detector</span>
                            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">Smart Monitor</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('app_subtitle')"></p>
                    </div>
                </div>

                <!-- Right Menu: Status, Theme, Language Switcher -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <!-- CCTV Active Count Badge -->
                    <div class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs">
                        <span class="w-2 h-2 rounded-full" :class="slots.length > 0 ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'"></span>
                        <span class="text-slate-700 dark:text-slate-300 font-semibold" x-text="slots.length + ' ' + t('cameras_connected')"></span>
                    </div>

                    <!-- Theme Toggle -->
                    <button @click="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition shadow-sm" :title="isDark ? t('theme_light') : t('theme_dark')">
                        <i class="fa-solid" :class="isDark ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'"></i>
                    </button>

                    <!-- Language Switcher (UZ / KO) -->
                    <div class="relative" x-data="{ langOpen: false }">
                        <button @click="langOpen = !langOpen" @click.outside="langOpen = false" class="h-9 px-2.5 flex items-center space-x-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold border border-slate-200 dark:border-slate-700 transition shadow-sm">
                            <span x-text="currentLang === 'uz' ? '🇺🇿 UZ' : '🇰🇷 KO'"></span>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                        </button>

                        <div x-show="langOpen" x-cloak class="absolute right-0 mt-2 w-36 bg-white dark:bg-darkcard rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 py-1 z-50 text-xs">
                            <button @click="setLanguage('uz'); langOpen = false" class="w-full px-3 py-2 text-left flex items-center space-x-2 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition" :class="currentLang === 'uz' ? 'text-blue-600 dark:text-blue-400 font-bold bg-blue-50/50 dark:bg-blue-950/30' : 'text-slate-700 dark:text-slate-300'">
                                <span>🇺🇿</span>
                                <span>O'zbekcha</span>
                            </button>
                            <button @click="setLanguage('ko'); langOpen = false" class="w-full px-3 py-2 text-left flex items-center space-x-2 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition" :class="currentLang === 'ko' ? 'text-blue-600 dark:text-blue-400 font-bold bg-blue-50/50 dark:bg-blue-950/30' : 'text-slate-700 dark:text-slate-300'">
                                <span>🇰🇷</span>
                                <span>한국어</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-[1780px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Top Row: Real-time Statistics Cards (4 Cards) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Total Detections -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="t('stat_total')"></p>
                    <h3 class="text-2xl font-black mt-1 text-slate-900 dark:text-white" x-text="stats.total_detections">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5"><span x-text="t('stat_today')"></span>: <span class="font-bold text-slate-700 dark:text-slate-300" x-text="stats.today_detections">0</span></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 dark:bg-blue-950/60 dark:text-blue-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-car-rear"></i>
                </div>
            </div>

            <!-- EV Detections -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-sky-500" x-text="t('stat_ev')"></p>
                    <h3 class="text-2xl font-black mt-1 text-sky-600 dark:text-sky-400" x-text="stats.ev_count">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5"><span x-text="t('stat_today')"></span>: <span class="font-bold text-sky-600 dark:text-sky-400" x-text="stats.today_ev">0</span></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-600 dark:bg-sky-950/60 dark:text-sky-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-charging-station"></i>
                </div>
            </div>

            <!-- Regular (Non-EV) Vehicles -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" x-text="t('stat_regular')"></p>
                    <h3 class="text-2xl font-black mt-1 text-slate-800 dark:text-slate-200" x-text="stats.regular_count">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5"><span x-text="t('stat_today')"></span>: <span class="font-bold text-slate-700 dark:text-slate-300" x-text="stats.today_regular">0</span></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-gas-pump"></i>
                </div>
            </div>

            <!-- Non-EV Parking Alerts -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between" :class="stats.today_alerts > 0 ? 'border-red-300 dark:border-red-900/50 bg-red-50/20' : ''">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-red-600 dark:text-red-400" x-text="t('stat_alerts')"></p>
                    <h3 class="text-2xl font-black mt-1 text-red-600 dark:text-red-400" x-text="stats.today_alerts">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5" x-text="t('stat_alert_desc')"></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-red-50 text-red-600 dark:bg-red-950/60 dark:text-red-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>
        </div>

        <!-- Middle 2-Column Section: Cameras Configuration & Test Recognition -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">

            <!-- LEFT: Camera Configuration & Live CCTV Slots List -->
            <div class="bg-white dark:bg-darkcard rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 p-5 sm:p-6 h-[380px] flex flex-col">
                <div class="flex items-center justify-between mb-3 shrink-0">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-base shadow-inner">
                            <i class="fa-solid fa-video"></i>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white" x-text="t('camera_mgmt_title')"></h2>
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 flex items-center space-x-1">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span x-text="slots.length + ' ' + t('cameras_connected')"></span>
                                </span>
                            </div>
                            <p class="text-[11px] text-slate-400">RTSP va IP kameralar monitoring holati</p>
                        </div>
                    </div>
                    <button @click="addCamModal = true" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 transition shadow-sm">
                        <i class="fa-solid fa-plus"></i>
                        <span x-text="t('btn_add_camera')"></span>
                    </button>
                </div>

                <!-- Scrollable Container for Camera Items -->
                <div class="flex-1 overflow-y-auto pr-1.5 space-y-2.5 custom-scrollbar">
                    <template x-for="slot in slots" :key="slot.camera_id">
                        <div class="p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30 flex items-center justify-between gap-3 hover:border-slate-300 dark:hover:border-slate-700 transition">
                            <div class="flex items-center space-x-3 min-w-0">
                                <div class="w-9 h-9 rounded-xl flex items-center justify-center text-xs shrink-0 shadow-inner" 
                                    :class="slot.is_online ? (slot.is_occupied ? (slot.is_ev ? 'bg-sky-100 text-sky-700 dark:bg-sky-950/60 dark:text-sky-400' : 'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-400') : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400') : 'bg-rose-100 text-rose-600 dark:bg-rose-950/60 dark:text-rose-400'">
                                    <i class="fa-solid" :class="slot.is_online ? 'fa-video' : 'fa-video-slash'"></i>
                                </div>
                                <div class="min-w-0 space-y-0.5">
                                    <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                                        <div class="flex items-center space-x-1 text-xs font-black text-slate-900 dark:text-white truncate">
                                            <i class="fa-solid fa-charging-station text-blue-500 text-[11px]"></i>
                                            <span x-text="slot.cs_id"></span>
                                            <span class="text-slate-300 dark:text-slate-600">/</span>
                                            <span class="text-blue-600 dark:text-blue-400 font-bold" x-text="slot.cp_id"></span>
                                        </div>
                                        <span class="text-[10px] text-slate-400 font-medium" x-text="'(' + (slot.camera_name || t('unnamed_camera')) + ')'"></span>
                                        
                                        <!-- Slot Occupancy Badge -->
                                        <template x-if="slot.is_occupied">
                                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold shadow-sm inline-flex items-center space-x-1"
                                                :class="slot.is_ev ? 'bg-sky-500 text-white' : 'bg-amber-500 text-slate-950'">
                                                <span x-show="slot.is_ev">⚡</span>
                                                <span x-text="slot.current_plate"></span>
                                                <span x-show="slot.duration_formatted" class="text-[9px] opacity-90" x-text="'(' + slot.duration_formatted + ')'"></span>
                                            </span>
                                        </template>
                                        <template x-if="!slot.is_occupied && slot.is_online">
                                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300">
                                                🟢 Bo'sh
                                            </span>
                                        </template>
                                        <template x-if="!slot.is_online">
                                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300">
                                                🔴 OFFLINE
                                            </span>
                                        </template>
                                    </div>
                                    <p class="text-[10px] font-mono text-slate-400 truncate max-w-[220px] sm:max-w-xs" x-text="slot.stream_url"></p>
                                </div>
                            </div>

                            <div class="flex items-center space-x-1.5 shrink-0">
                                <!-- Live Stream & AI Test Button -->
                                <button @click="openLiveModal(slot)" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white shadow-sm transition flex items-center space-x-1.5">
                                    <i class="fa-solid fa-circle-play text-[11px]"></i>
                                    <span class="hidden sm:inline" x-text="t('btn_test')"></span>
                                </button>
                                <!-- Delete Button -->
                                <button @click="deleteCamera(slot.camera_id)" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-950/50 text-slate-400 hover:text-red-500 flex items-center justify-center transition" :title="t('btn_delete')">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                    <template x-if="slots.length === 0">
                        <div class="text-center py-14 text-slate-400 text-xs">
                            <div class="w-12 h-12 mx-auto mb-2 rounded-2xl bg-blue-50 dark:bg-blue-950/50 text-blue-500 flex items-center justify-center text-xl shadow-inner">
                                <i class="fa-solid fa-video"></i>
                            </div>
                            <p class="font-bold" x-text="t('no_cameras_msg')"></p>
                            <button @click="addCamModal = true" class="mt-3 px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-sm transition">
                                <i class="fa-solid fa-plus mr-1"></i> <span x-text="t('btn_add_camera')"></span>
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- RIGHT: Test Upload & Recognition Box (Matched Height) -->
            <div class="bg-white dark:bg-darkcard p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 h-[380px] flex flex-col">
                <div class="flex items-center justify-between mb-3 shrink-0">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-base shadow-inner">
                            <i class="fa-solid fa-file-arrow-up"></i>
                        </div>
                        <div>
                            <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white" x-text="t('test_title')"></h2>
                            <p class="text-[11px] text-slate-400" x-text="t('korean_plates_support')"></p>
                        </div>
                    </div>
                </div>

                <!-- Drag & Drop Box + Inline Detection Result -->
                <div class="flex-1 flex flex-col overflow-y-auto pr-1.5 custom-scrollbar">
                    <!-- Dropzone -->
                    <div 
                        class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-4 text-center hover:bg-slate-50 dark:hover:bg-slate-800/60 transition cursor-pointer relative flex-1 flex flex-col items-center justify-center min-h-[140px]"
                        @dragover.prevent="dragOver = true"
                        @dragleave.prevent="dragOver = false"
                        @drop.prevent="handleDrop($event)"
                        :class="dragOver ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-950/30' : ''"
                        @click="$refs.fileInput.click()"
                    >
                        <input type="file" x-ref="fileInput" class="hidden" accept="image/*" @change="handleFileSelect($event)">
                        
                        <div x-show="!isUploading">
                            <div class="w-10 h-10 mx-auto rounded-2xl bg-indigo-50 dark:bg-slate-800 flex items-center justify-center text-indigo-600 dark:text-indigo-400 mb-2 text-lg">
                                <i class="fa-regular fa-image"></i>
                            </div>
                            <p class="text-xs font-bold text-slate-700 dark:text-slate-200" x-text="t('dropzone_prompt')"></p>
                            <p class="text-[10px] text-slate-400 mt-0.5" x-text="t('dropzone_formats')"></p>
                        </div>
                        
                        <div x-show="isUploading" class="py-3 flex flex-col items-center justify-center space-y-2">
                            <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-600"></i>
                            <p class="text-xs font-bold text-slate-700 dark:text-slate-200" x-text="t('analyzing_title')"></p>
                            <p class="text-[10px] text-slate-400" x-text="t('analyzing_desc')"></p>
                        </div>
                    </div>

                    <!-- Detection Live Result Card (Inline) -->
                    <div x-show="uploadResult" x-cloak class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold text-slate-900 dark:text-white flex items-center">
                                <i class="fa-solid fa-circle-check mr-1.5 text-emerald-500"></i> <span x-text="t('result_title')"></span>
                            </h3>
                            <span class="text-[10px] font-mono text-slate-400" x-text="uploadResult ? (uploadResult.processing_time_ms + ' ms') : ''"></span>
                        </div>

                        <!-- SUCCESS RESULT -->
                        <template x-if="uploadResult && uploadResult.success && uploadResult.data">
                            <div class="p-3 rounded-xl border flex items-center justify-between gap-2"
                                :class="uploadResult.data.is_ev ? 'bg-sky-50/60 dark:bg-sky-950/30 border-sky-300 dark:border-sky-800' : 'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700'">
                                <div class="flex items-center space-x-3">
                                    <span class="text-2xl" x-text="uploadResult.data.is_ev ? '⚡' : '🚗'"></span>
                                    <div>
                                        <div class="font-mono font-black text-sm text-slate-900 dark:text-white" x-text="uploadResult.data.plate_number"></div>
                                        <span class="text-[11px] font-bold" :class="uploadResult.data.is_ev ? 'text-sky-500' : 'text-slate-500'" x-text="uploadResult.data.is_ev ? '⚡ EV Tasdiqlandi' : '🚗 Oddiy avtomobil'"></span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs font-mono font-bold text-slate-600 dark:text-slate-300" x-text="((uploadResult.data.confidence || 0) * 100).toFixed(0) + '%'"></span>
                                </div>
                            </div>
                        </template>

                        <!-- ERROR / UNRECOGNIZED RESULT -->
                        <template x-if="uploadResult && !uploadResult.success">
                            <div class="p-3 rounded-xl border border-rose-200 dark:border-rose-900 bg-rose-50/60 dark:bg-rose-950/20 flex items-center space-x-2 text-rose-700 dark:text-rose-400 text-xs">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                                <span x-text="uploadResult.message || 'Raqam aniqlanmadi'"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM FULL-WIDTH SECTION: Aniqlangan mashinalar jurnali (Events Table) -->
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            <div class="p-5 border-b border-slate-100 dark:border-slate-800/80 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-sm font-bold shadow-inner">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('history_title')"></h2>
                        <p class="text-xs text-slate-400 dark:text-slate-500">Stansiya va parkovka joylari bo'yicha kirish/chiqish tarixi</p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <select x-model="filters.type" @change="fetchVehicles()" class="text-xs px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold focus:ring-2 focus:ring-blue-500 outline-none transition cursor-pointer">
                        <option value="" x-text="t('filter_all')"></option>
                        <option value="EV" x-text="t('filter_ev_only')"></option>

                btn_delete: "삭제",
                no_cameras_msg: "등록된 CCTV 카메라가 없습니다.",
                history_title: "감지 이력 목록",
                filter_all: "전체 차량",
                filter_ev_only: "전기차 (EV) 만",
                filter_regular_only: "일반 차량 (내연기관)",
                btn_refresh: "새로고침",
                th_time: "시간",
                th_plate: "차량 번호판",
                th_type: "유형",
                th_confidence: "신뢰도",
                th_actions: "작업",
                unrecognized: "미인식",
                view_image: "사진 보기",
                no_history_msg: "기록된 차량 감지 데이터가 없습니다.",
                btn_prev: "이전",
                btn_next: "다음",
                page_label: "페이지",
                btn_ai_scan_now: "⚡ 현재 프레임 AI 번호판 분석",
                confirm_delete_vehicle: "이 감지 기록을 삭제하시겠습니까?",
                confirm_delete_cam: "정말 이 카메라를 삭제하시겠습니까?",
                upload_img_only: "이미지 파일만 업로드 가능합니다."
            }
        };

        document.addEventListener('alpine:init', () => {
            Alpine.data('appData', () => ({
                isDark: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches),
                currentLang: localStorage.getItem('app_lang') || 'uz',

                stats: { total_detections: 0, ev_count: 0, regular_count: 0, today_detections: 0, today_ev: 0, today_regular: 0, today_alerts: 0 },
                slots: [],
                
                dragOver: false,
                isUploading: false,
                uploadResult: null,
                
                vehicles: [],
                totalVehicles: 0,
                page: 1,
                pageSize: 6,
                filters: { type: '' },
                
                addCamModal: false,
                newCam: {
                    cs_id: 'bluenetwrks',
                    cp_id: 'BNS00000',
                    camera_name: '',
                    camera_type: 'RTSP',
                    stream_url: '',
                    ip_address: '',
                    port: 554,
                    username: '',
                    password: '',
                    is_active: true
                },

                liveModal: { open: false, slot: null, aiLoading: false, aiResult: null, aiError: null },
                previewImage: { open: false, url: '' },
                isSavingCam: false,
                
                init() {
                    this.$watch('isDark', val => localStorage.setItem('theme', val ? 'dark' : 'light'));
                    this.fetchStats();
                    this.fetchSlots();
                    this.fetchVehicles();
                    
                    // Live polling every 3s for real-time slot and detection updates
                    setInterval(() => {
                        this.fetchSlots();
                        this.fetchStats();
                        if (this.page === 1) this.fetchVehicles();
                    }, 3000);
                },

                t(key) {
                    const dict = translations[this.currentLang] || translations.uz;
                    return dict[key] || key;
                },

                setLanguage(lang) {
                    this.currentLang = lang;
                    localStorage.setItem('app_lang', lang);
                },
                
                toggleTheme() {
                    this.isDark = !this.isDark;
                },
                
                async fetchStats() {
                    try {
                        const res = await fetch('/api/v1/stats/summary');
                        if (res.ok) this.stats = await res.json();
                    } catch (e) { console.error("Stats fetch error:", e); }
                },

                async fetchSlots() {
                    try {
                        const res = await fetch('/api/v1/cameras/slots-status');
                        if (res.ok) {
                            this.slots = await res.json();
                        }
                    } catch (e) { console.error("Slots fetch error:", e); }
                },
                
                async fetchVehicles() {
                    try {
                        let url = `/api/v1/vehicles?page=${this.page}&page_size=${this.pageSize}`;
                        if (this.filters.type === 'EV') url += '&is_ev=true';
                        else if (this.filters.type === 'REGULAR') url += '&vehicle_type=REGULAR';
                        
                        const res = await fetch(url);
                        if (res.ok) {
                            const data = await res.json();
                            this.vehicles = data.items;
                            this.totalVehicles = data.total;
                        }
                    } catch (e) { console.error("Vehicles fetch error:", e); }
                },

                async createCamera() {
                    try {
                        this.isSavingCam = true;
                        if (!this.newCam.port) {
                            this.newCam.port = this.newCam.camera_type === 'RTSP' ? 554 : 80;
                        }
                        if (!this.newCam.stream_url) {
                            if (this.newCam.ip_address) {
                                if (this.newCam.camera_type === 'RTSP') {
                                    this.newCam.stream_url = `rtsp://${this.newCam.ip_address}:${this.newCam.port}/stream1`;
                                } else {
                                    const portPart = (this.newCam.port && this.newCam.port !== 80) ? `:${this.newCam.port}` : '';
                                    this.newCam.stream_url = `http://${this.newCam.ip_address}${portPart}/api/snapshot`;
                                }
                            }
                        }
                        const res = await fetch('/api/v1/cameras', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.newCam)
                        });
                        if (res.ok) {
                            await this.fetchSlots();
                            this.addCamModal = false;
                            this.newCam = {
                                cs_id: 'bluenetwrks', cp_id: 'BNS00000',
                                camera_name: '', camera_type: 'RTSP', stream_url: '',
                                ip_address: '', port: 554, username: '', password: '', is_active: true
                            };
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            const msg = errData.detail || "Kameraga ulanib bo'lmadi! IP manzil va sozlamalarni tekshiring.";
                            alert("❌ Xatolik: " + msg);
                        }
                    } catch (e) {
                        console.error("Create camera error:", e);
                        alert("❌ Ulanish xatosi: " + e.message);
                    } finally {
                        this.isSavingCam = false;
                    }
                },

                openLiveModal(slot) {
                    this.liveModal = {
                        open: true,
                        slot: slot,
                        aiLoading: false,
                        aiResult: null,
                        aiError: null
                    };
                },

                closeLiveModal() {
                    this.liveModal = {
                        open: false,
                        slot: null,
                        aiLoading: false,
                        aiResult: null,
                        aiError: null
                    };
                },

                async scanLiveFrame() {
                    if (!this.liveModal.slot) return;
                    this.liveModal.aiLoading = true;
                    this.liveModal.aiResult = null;
                    this.liveModal.aiError = null;
                    try {
                        const res = await fetch(`/api/v1/cameras/${this.liveModal.slot.camera_id}/test`, { method: 'POST' });
                        const data = await res.json();
                        if (data.success && data.image_base64) {
                            const byteCharacters = atob(data.image_base64);
                            const byteNumbers = new Array(byteCharacters.length);
                            for (let i = 0; i < byteCharacters.length; i++) {
                                byteNumbers[i] = byteCharacters.charCodeAt(i);
                            }
                            const byteArray = new Uint8Array(byteNumbers);
                            const blob = new Blob([byteArray], { type: 'image/jpeg' });
                            
                            const formData = new FormData();
                            formData.append('file', blob, 'cctv_live_snap.jpg');
                            formData.append('cs_id', this.liveModal.slot.cs_id || 'bluenetwrks');
                            formData.append('cp_id', this.liveModal.slot.cp_id || 'BNS00000');
                            
                            const detRes = await fetch('/api/v1/detect/upload', {
                                method: 'POST',
                                body: formData
                            });
                            this.liveModal.aiLoading = false;
                            if (detRes.ok) {
                                const json = await detRes.json();
                                if (json.success && json.data) {
                                    this.liveModal.aiResult = { ...json.data, success: true };
                                } else {
                                    this.liveModal.aiResult = { success: false, message: json.message || 'Raqam aniqlanmadi' };
                                }
                                this.fetchStats();
                                this.fetchVehicles();
                                this.fetchSlots();
                            } else {
                                this.liveModal.aiError = 'AI tahlil xatosi yuz berdi';
                            }
                        } else {
                            this.liveModal.aiLoading = false;
                            this.liveModal.aiError = data.message || "Kameradan kadr olib bo'lmadi";
                        }
                    } catch (e) {
                        this.liveModal.aiLoading = false;
                        this.liveModal.aiError = 'Kamera bilan aloqa xatosi: ' + e;
                    }
                },

                async deleteCamera(id) {
                    if (!confirm(this.t('confirm_delete_cam'))) return;
                    try {
                        await fetch(`/api/v1/cameras/${id}`, { method: 'DELETE' });
                        this.fetchSlots();
                    } catch (e) { console.error(e); }
                },
                
                get totalPages() {
                    return Math.ceil(this.totalVehicles / this.pageSize) || 1;
                },
                
                prevPage() {
                    if (this.page > 1) { this.page--; this.fetchVehicles(); }
                },
                
                nextPage() {
                    if (this.page < this.totalPages) { this.page++; this.fetchVehicles(); }
                },
                
                async deleteVehicle(id) {
                    if (!confirm(this.t('confirm_delete_vehicle'))) return;
                    try {
                        await fetch(`/api/v1/vehicles/${id}`, { method: 'DELETE' });
                        this.fetchVehicles();
                        this.fetchStats();
                        this.fetchSlots();
                    } catch (e) { console.error(e); }
                },
                
                handleFileSelect(e) {
                    if (e.target.files.length) this.uploadImage(e.target.files[0]);
                },
                
                handleDrop(e) {
                    this.dragOver = false;
                    if (e.dataTransfer.files.length) this.uploadImage(e.dataTransfer.files[0]);
                },
                
                async uploadImage(file) {
                    if (!file.type.startsWith('image/')) {
                        alert(this.t('upload_img_only'));
                        return;
                    }
                    
                    this.isUploading = true;
                    this.uploadResult = null;
                    
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('cs_id', 'bluenetwrks');
                    formData.append('cp_id', 'BNS00000');
                    
                    try {
                        const res = await fetch('/api/v1/detect/upload', {
                            method: 'POST',
                            body: formData
                        });
                        this.uploadResult = await res.json();
                        
                        this.fetchStats();
                        this.fetchVehicles();
                        this.fetchSlots();
                    } catch (e) {
                        this.uploadResult = { success: false, message: 'Server communication error' };
                        console.error(e);
                    } finally {
                        this.isUploading = false;
                    }
                },

                openImageModal(url) {
                    if (!url) return;
                    this.previewImage = { open: true, url: url };
                },
                
                formatDate(dateStr) {
                    if (!dateStr) return '';
                    const d = new Date(dateStr.includes('T') ? dateStr : dateStr.replace(' ', 'T'));
                    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                },

                formatNote(item) {
                    if (!item) return '';
                    if (item.event_type === 'END') {
                        if (item.notes && item.notes.startsWith('Chiqish: ')) {
                            return item.notes.replace('Chiqish: ', '⏱️ ');
                        }
                        return item.notes ? '⏱️ ' + item.notes : '⏱️ Chiqish qayd etildi';
                    }
                    if (item.event_type === 'START') {
                        return '🚗 Kirish vaqti';
                    }
                    if (item.detection_source === 'CCTV_AUTO') {
                        return '📹 CCTV Avto';
                    }
                    if (item.detection_source === 'MANUAL_UPLOAD') {
                        return "📤 Qo'lda tahlil";
                    }
                    return item.notes || '';
                }
            }));
        });
    </script>
