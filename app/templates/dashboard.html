<!DOCTYPE html>
<html lang="ko" x-data="appData()" :class="{ 'dark': isDark }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV EV Detector | Blue Networks</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#2563EB',
                        ev: '#0284C7',
                        alert: '#DC2626',
                        success: '#16A34A',
                        darkcard: '#1E293B',
                        darkbg: '#0F172A'
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.99); }
        }
        .animate-alert {
            animation: pulse-slow 2s infinite ease-in-out;
        }
        /* Custom smooth scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkbg dark:text-slate-100 transition-colors duration-200 min-h-screen">

    <!-- Top Navbar -->
    <nav class="bg-white/90 dark:bg-darkcard/90 backdrop-blur-md shadow-sm border-b border-slate-200 dark:border-slate-700/80 sticky top-0 z-40">
        <div class="max-w-[1680px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo & Brand -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                        <i class="fa-solid fa-bolt-lightning text-xl"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white">CCTV EV Detector</span>
                            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">v1.0</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('app_subtitle')"></p>
                    </div>
                </div>

                <!-- Right Menu: Status, Theme, Settings, Language Switcher -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <!-- CCTV Status Badge -->
                    <div class="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs">
                        <span class="w-2 h-2 rounded-full" :class="cameras.length > 0 ? 'bg-emerald-500 animate-ping' : 'bg-amber-500'"></span>
                        <span class="text-slate-600 dark:text-slate-300" x-text="cameras.length + ' ' + t('cameras_connected')"></span>
                    </div>

                    <!-- Theme Toggle -->
                    <button @click="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition" :title="isDark ? t('theme_light') : t('theme_dark')">
                        <i class="fa-solid" :class="isDark ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'"></i>
                    </button>

                    <!-- Settings Dropdown -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false" class="w-9 h-9 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition" :title="t('settings_title')">
                            <i class="fa-solid fa-gear"></i>
                        </button>

                        <div x-show="open" x-cloak class="absolute right-0 mt-2 w-80 bg-white dark:bg-darkcard rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-4 z-50 text-sm">
                            <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700">
                                <h3 class="font-bold text-slate-900 dark:text-white flex items-center">
                                    <i class="fa-solid fa-sliders mr-2 text-brand"></i> <span x-text="t('settings_title')"></span>
                                </h3>
                                <button @click="open = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <div class="py-3 space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('auto_monitor_label')"></label>
                                    <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700">
                                        <span class="text-xs text-slate-600 dark:text-slate-400" x-text="t('auto_monitor_desc')"></span>
                                        <span class="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300" x-text="t('monitor_active')"></span>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('ev_blue_threshold')"></label>
                                    <div class="flex items-center space-x-2">
                                        <input type="range" min="15" max="50" value="30" class="w-full accent-blue-600">
                                        <span class="text-xs font-mono font-bold text-slate-700 dark:text-slate-300">30%</span>
                                    </div>
                                    <p class="text-[11px] text-slate-500 mt-1" x-text="t('ev_threshold_desc')"></p>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" x-text="t('alert_sound_label')"></label>
                                    <label class="flex items-center space-x-2 cursor-pointer">
                                        <input type="checkbox" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                        <span class="text-xs text-slate-700 dark:text-slate-300" x-text="t('alert_visual_toggle')"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="pt-2 border-t border-slate-200 dark:border-slate-700 flex justify-end">
                                <button @click="open = false" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition" x-text="t('btn_save_settings')">
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Language Switcher (UZ / KO) -->
                    <div class="relative" x-data="{ langOpen: false }">
                        <button @click="langOpen = !langOpen" @click.outside="langOpen = false" class="h-9 px-2.5 flex items-center space-x-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold border border-slate-200 dark:border-slate-700 transition" :title="t('lang_title')">
                            <span x-text="currentLang === 'uz' ? '🇺🇿 UZ' : '🇰🇷 KO'"></span>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                        </button>

                        <div x-show="langOpen" x-cloak class="absolute right-0 mt-2 w-36 bg-white dark:bg-darkcard rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 py-1 z-50 text-xs">
                            <button @click="setLanguage('uz'); langOpen = false" class="w-full px-3 py-2 text-left flex items-center space-x-2 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition" :class="currentLang === 'uz' ? 'text-blue-600 dark:text-blue-400 font-bold bg-blue-50/50 dark:bg-blue-950/30' : 'text-slate-700 dark:text-slate-300'">
                                <span>🇺🇿</span>
                                <span>O'zbekcha</span>
                            </button>
                            <button @click="setLanguage('ko'); langOpen = false" class="w-full px-3 py-2 text-left flex items-center space-x-2 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition" :class="currentLang === 'ko' ? 'text-blue-600 dark:text-blue-400 font-bold bg-blue-50/50 dark:bg-blue-950/30' : 'text-slate-700 dark:text-slate-300'">
                                <span>🇰🇷</span>
                                <span>한국어</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container (Full-Width Responsive Canvas) -->
    <main class="max-w-[1680px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Top Statistics Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Total Detections -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" x-text="t('stat_total')"></p>
                    <h3 class="text-2xl font-black mt-1 text-slate-900 dark:text-white" x-text="stats.total_detections">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5" x-text="t('stat_today') + ': ' + stats.today_detections"></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 dark:bg-blue-950/60 dark:text-blue-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-camera"></i>
                </div>
            </div>

            <!-- EV Detections -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-sky-600 dark:text-sky-400" x-text="t('stat_ev')"></p>
                    <h3 class="text-2xl font-black mt-1 text-sky-600 dark:text-sky-400" x-text="stats.ev_count">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5" x-text="t('stat_today') + ': ' + stats.today_ev"></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-600 dark:bg-sky-950/60 dark:text-sky-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-bolt"></i>
                </div>
            </div>

            <!-- Regular Detections -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" x-text="t('stat_regular')"></p>
                    <h3 class="text-2xl font-black mt-1 text-slate-700 dark:text-slate-200" x-text="stats.regular_count">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5" x-text="t('stat_today') + ': ' + stats.today_regular"></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-gas-pump"></i>
                </div>
            </div>

            <!-- Today Alerts -->
            <div class="bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between" :class="stats.today_alerts > 0 ? 'border-red-300 dark:border-red-900/50 bg-red-50/20' : ''">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-red-600 dark:text-red-400" x-text="t('stat_alerts')"></p>
                    <h3 class="text-2xl font-black mt-1 text-red-600 dark:text-red-400" x-text="stats.today_alerts">0</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5" x-text="t('stat_alert_desc')"></p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-red-50 text-red-600 dark:bg-red-950/60 dark:text-red-400 flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>
        </div>

        <!-- Middle 2-Column Section: Cameras & Test Recognition (Matched Heights) -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">

            <!-- LEFT: Camera Configuration & Live CCTV (h-[340px] scrollable box) -->
            <div class="bg-white dark:bg-darkcard rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 p-5 sm:p-6 h-[340px] flex flex-col" x-data="{ addCamOpen: false }">
                <div class="flex items-center justify-between mb-3 shrink-0">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-sm shadow-inner">
                            <i class="fa-solid fa-video"></i>
                        </div>
                        <div>
                            <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white" x-text="t('camera_mgmt_title')"></h2>
                            <p class="text-[11px] text-slate-400">RTSP va IP kameralar holati</p>
                        </div>
                    </div>
                    <button @click="addCamOpen = !addCamOpen" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition shadow-sm">
                        <i class="fa-solid" :class="addCamOpen ? 'fa-xmark' : 'fa-plus'"></i>
                        <span x-text="addCamOpen ? t('btn_close') : t('btn_add_camera')"></span>
                    </button>
                </div>

                <!-- Scrollable Container for Add Form & Camera List -->
                <div class="flex-1 overflow-y-auto pr-1.5 space-y-2.5 custom-scrollbar">
                    <!-- Add Camera Form (Collapsible) -->
                    <div x-show="addCamOpen" x-cloak class="mb-3 p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 space-y-3" x-data="{ showAdvanced: false }">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500" x-text="t('add_camera_header')"></h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 dark:text-slate-300 mb-0.5" x-text="t('cam_name_label')"></label>
                                <input type="text" x-model="newCam.camera_name" :placeholder="t('cam_name_ph')" class="w-full text-xs p-1.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 dark:text-slate-300 mb-0.5" x-text="t('cam_ip_label')"></label>
                                <div class="flex space-x-1.5">
                                    <input type="text" x-model="newCam.ip_address" placeholder="192.168.0.16" class="w-2/3 text-xs p-1.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-mono">
                                    <input type="number" x-model.number="newCam.port" :placeholder="newCam.camera_type === 'RTSP' ? '554' : '80'" class="w-1/3 text-xs p-1.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-mono" :title="t('cam_port_label')">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 dark:text-slate-300 mb-0.5" x-text="t('cam_protocol_label')"></label>
                                <select x-model="newCam.camera_type" class="w-full text-xs p-1.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                                    <option value="RTSP">RTSP Stream (Tavsiya etiladi)</option>
                                    <option value="HTTP_SNAPSHOT">HTTP Snapshot</option>
                                    <option value="ONVIF">ONVIF Protocol</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 dark:text-slate-300 mb-0.5" x-text="t('cam_user_label') + ' / ' + t('cam_pass_label')"></label>
                                <div class="flex space-x-1.5">
                                    <input type="text" x-model="newCam.username" placeholder="admin" class="w-1/2 text-xs p-1.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                                    <input type="password" x-model="newCam.password" placeholder="••••••••" class="w-1/2 text-xs p-1.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white">
                                </div>
                            </div>
                        </div>

                        <!-- Optional Advanced URL Toggle -->
                        <div>
                            <button type="button" @click="showAdvanced = !showAdvanced" class="text-[10px] text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 flex items-center space-x-1">
                                <i class="fa-solid text-[8px]" :class="showAdvanced ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                                <span x-text="t('advanced_url_toggle')"></span>
                            </button>
                            <div x-show="showAdvanced" class="mt-1.5">
                                <input type="text" x-model="newCam.stream_url" :placeholder="newCam.camera_type === 'RTSP' ? 'rtsp://192.168.0.16:554/stream1' : 'http://192.168.0.16/api/snapshot'" class="w-full text-xs p-1.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white font-mono">
                            </div>
                        </div>

                        <div class="flex justify-end pt-1">
                            <button @click="createCamera()" :disabled="isSavingCam || (!newCam.ip_address && !newCam.stream_url)" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-1.5">
                                <span x-show="!isSavingCam" x-text="t('btn_save_camera')"></span>
                                <span x-show="isSavingCam" class="flex items-center space-x-1">
                                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                                    <span>Tekshirilmoqda...</span>
                                </span>
                            </button>
                        </div>
                    </div>

                    <!-- Camera List Items -->
                    <template x-for="cam in cameras" :key="cam.id">
                        <div class="p-3 rounded-xl border border-slate-200/80 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30 flex items-center justify-between gap-3 hover:border-slate-300 dark:hover:border-slate-700 transition">
                            <div class="flex items-center space-x-3 min-w-0">
                                <div class="w-8 h-8 rounded-xl flex items-center justify-center text-xs shrink-0 shadow-inner" :class="cam.is_active ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400' : 'bg-slate-200 text-slate-500'">
                                    <i class="fa-solid fa-video"></i>
                                </div>
                                <div class="min-w-0">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xs font-bold text-slate-900 dark:text-white truncate" x-text="cam.camera_name || t('unnamed_camera')"></span>
                                        <span class="text-[9px] uppercase font-mono px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold" x-text="cam.camera_type"></span>
                                    </div>
                                    <p class="text-[10px] font-mono text-slate-400 truncate max-w-[200px] sm:max-w-xs" x-text="cam.stream_url"></p>
                                </div>
                            </div>

                            <div class="flex items-center space-x-1.5 shrink-0">
                                <!-- Live Stream Button -->
                                <button @click="openLiveModal(cam)" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white shadow-sm transition flex items-center space-x-1">
                                    <i class="fa-solid fa-circle-play text-[11px]"></i>
                                    <span class="hidden sm:inline" x-text="t('btn_test')"></span>
                                </button>
                                <!-- Delete Button -->
                                <button @click="deleteCamera(cam.id)" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-950/50 text-slate-400 hover:text-red-500 flex items-center justify-center transition" :title="t('btn_delete')">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                    <template x-if="cameras.length === 0">
                        <div class="text-center py-10 text-slate-400 text-xs" x-text="t('no_cameras_msg')"></div>
                    </template>
                </div>
            </div>

            <!-- RIGHT: Test Upload & Recognition Box (h-[340px] matched box) -->
            <div class="bg-white dark:bg-darkcard p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 h-[340px] flex flex-col">
                <div class="flex items-center justify-between mb-3 shrink-0">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-sm shadow-inner">
                            <i class="fa-solid fa-file-arrow-up"></i>
                        </div>
                        <div>
                            <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white" x-text="t('test_title')"></h2>
                            <p class="text-[11px] text-slate-400" x-text="t('korean_plates_support')"></p>
                        </div>
                    </div>
                </div>

                <!-- Drag & Drop Box + Result Area (Scrollable if needed) -->
                <div class="flex-1 flex flex-col overflow-y-auto pr-1.5 custom-scrollbar">
                    <!-- Dropzone -->
                    <div 
                        class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-4 text-center hover:bg-slate-50 dark:hover:bg-slate-800/60 transition cursor-pointer relative flex-1 flex flex-col items-center justify-center"
                        @dragover.prevent="dragOver = true"
                        @dragleave.prevent="dragOver = false"
                        @drop.prevent="handleDrop($event)"
                        :class="dragOver ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-950/30' : ''"
                        @click="$refs.fileInput.click()"
                    >
                        <input type="file" x-ref="fileInput" class="hidden" accept="image/*" @change="handleFileSelect($event)">
                        
                        <div x-show="!isUploading">

        document.addEventListener('alpine:init', () => {
            Alpine.data('appData', () => ({
                isDark: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches),
                currentLang: localStorage.getItem('app_lang') || 'uz',
                
                stats: { total_detections: 0, ev_count: 0, regular_count: 0, today_detections: 0, today_ev: 0, today_regular: 0, today_alerts: 0 },
                
                dragOver: false,
                isUploading: false,
                uploadResult: null,
                
                vehicles: [],
                totalVehicles: 0,
                page: 1,
                pageSize: 6,
                filters: { type: '' },
                
                cameras: [],
                newCam: {
                    cs_id: 'CS_TASHKENT_01',
                    cp_id: 'CP01',
                    camera_name: '',
                    camera_type: 'RTSP',
                    stream_url: '',
                    ip_address: '',
                    port: 554,
                    username: '',
                    password: '',
                    is_active: true
                },

                liveModal: { open: false, camera: null, aiLoading: false, aiResult: null, aiError: null },
                previewImage: { open: false, url: '' },
                isSavingCam: false,
                
                init() {
                    this.$watch('isDark', val => localStorage.setItem('theme', val ? 'dark' : 'light'));
                    this.fetchStats();
                    this.fetchVehicles();
                    this.fetchCameras();
                    
                    // Auto-refresh stats & log every 15s
                    setInterval(() => {
                        this.fetchStats();
                        if (this.page === 1) this.fetchVehicles();
                    }, 15000);
                },

                t(key) {
                    const dict = translations[this.currentLang] || translations.uz;
                    return dict[key] || key;
                },

                setLanguage(lang) {
                    this.currentLang = lang;
                    localStorage.setItem('app_lang', lang);
                },
                
                toggleTheme() {
                    this.isDark = !this.isDark;
                },
                
                async fetchStats() {
                    try {
                        const res = await fetch('/api/v1/stats/summary');
                        if (res.ok) this.stats = await res.json();
                    } catch (e) { console.error("Stats fetch error:", e); }
                },
                
                async fetchVehicles() {
                    try {
                        let url = `/api/v1/vehicles?page=${this.page}&page_size=${this.pageSize}`;
                        if (this.filters.type === 'EV') url += '&is_ev=true';
                        else if (this.filters.type === 'REGULAR') url += '&vehicle_type=REGULAR';
                        
                        const res = await fetch(url);
                        if (res.ok) {
                            const data = await res.json();
                            this.vehicles = data.items;
                            this.totalVehicles = data.total;
                        }
                    } catch (e) { console.error("Vehicles fetch error:", e); }
                },
                
                async fetchCameras() {
                    try {
                        const res = await fetch('/api/v1/cameras');
                        if (res.ok) this.cameras = await res.json();
                    } catch (e) { console.error("Cameras fetch error:", e); }
                },

                async createCamera() {
                    try {
                        this.isSavingCam = true;
                        if (!this.newCam.stream_url && this.newCam.ip_address) {
                            if (this.newCam.camera_type === 'RTSP') {
                                this.newCam.stream_url = `rtsp://${this.newCam.ip_address}:${this.newCam.port || 554}/stream1`;
                            } else {
                                const portPart = (this.newCam.port && this.newCam.port !== 80) ? `:${this.newCam.port}` : '';
                                this.newCam.stream_url = `http://${this.newCam.ip_address}${portPart}/api/snapshot`;
                            }
                        }
                        if (!this.newCam.port) {
                            this.newCam.port = this.newCam.camera_type === 'RTSP' ? 554 : 80;
                        }
                        const res = await fetch('/api/v1/cameras', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.newCam)
                        });
                        if (res.ok) {
                            await this.fetchCameras();
                            this.addCamOpen = false;
                            this.newCam = {
                                cs_id: 'CS_TASHKENT_01', cp_id: 'CP01',
                                camera_name: '', camera_type: 'RTSP', stream_url: '',
                                ip_address: '', port: 554, username: '', password: '', is_active: true
                            };
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            const msg = errData.detail || "Kameraga ulanib bo'lmadi! IP manzil va sozlamalarni tekshiring.";
                            alert("❌ Xatolik: " + msg);
                        }
                    } catch (e) {
                        console.error("Create camera error:", e);
                        alert("❌ Ulanish xatosi: " + e.message);
                    } finally {
                        this.isSavingCam = false;
                    }
                },

                openLiveModal(cam) {
                    this.liveModal = {
                        open: true,
                        camera: cam,
                        aiLoading: false,
                        aiResult: null,
                        aiError: null
                    };
                },

                closeLiveModal() {
                    this.liveModal = {
                        open: false,
                        camera: null,
                        aiLoading: false,
                        aiResult: null,
                        aiError: null
                    };
                },

                async scanLiveFrame() {
                    if (!this.liveModal.camera) return;
                    this.liveModal.aiLoading = true;
                    this.liveModal.aiResult = null;
                    this.liveModal.aiError = null;
                    try {
                        const res = await fetch(`/api/v1/cameras/${this.liveModal.camera.id}/test`, { method: 'POST' });
                        const data = await res.json();
                        if (data.success && data.image_base64) {
                            // Convert base64 to Blob and send to detect endpoint
                            const byteCharacters = atob(data.image_base64);
                            const byteNumbers = new Array(byteCharacters.length);
                            for (let i = 0; i < byteCharacters.length; i++) {
                                byteNumbers[i] = byteCharacters.charCodeAt(i);
                            }
                            const byteArray = new Uint8Array(byteNumbers);
                            const blob = new Blob([byteArray], { type: 'image/jpeg' });
                            
                            const formData = new FormData();
                            formData.append('file', blob, 'cctv_live_snap.jpg');
                            formData.append('cs_id', this.liveModal.camera.cs_id || 'CS_TASHKENT_01');
                            formData.append('cp_id', this.liveModal.camera.cp_id || 'CP01');
                            
                            const detRes = await fetch('/api/v1/detect/upload', {
                                method: 'POST',
                                body: formData
                            });
                            this.liveModal.aiLoading = false;
                            if (detRes.ok) {
                                const json = await detRes.json();
                                if (json.success && json.data) {
                                    this.liveModal.aiResult = { ...json.data, success: true };
                                } else {
                                    this.liveModal.aiResult = { success: false, message: json.message || 'Raqam aniqlanmadi' };
                                }
                                this.fetchStats();
                                this.fetchVehicles();
                            } else {
                                this.liveModal.aiError = 'AI tahlil xatosi yuz berdi';
                            }
                        } else {
                            this.liveModal.aiLoading = false;
                            this.liveModal.aiError = data.message || 'Kameradan kadr olib bo\'lmadi';
                        }
                    } catch (e) {
                        this.liveModal.aiLoading = false;
                        this.liveModal.aiError = 'Kamera bilan aloqa xatosi: ' + e;
                    }
                },

                async deleteCamera(id) {
                    if (!confirm(this.t('confirm_delete_cam'))) return;
                    try {
                        await fetch(`/api/v1/cameras/${id}`, { method: 'DELETE' });
                        this.fetchCameras();
                    } catch (e) { console.error(e); }
                },
                
                get totalPages() {
                    return Math.ceil(this.totalVehicles / this.pageSize) || 1;
                },
                
                prevPage() {
                    if (this.page > 1) { this.page--; this.fetchVehicles(); }
                },
                
                nextPage() {
                    if (this.page < this.totalPages) { this.page++; this.fetchVehicles(); }
                },
                
                async deleteVehicle(id) {
                    if (!confirm(this.t('confirm_delete_vehicle'))) return;
                    try {
                        await fetch(`/api/v1/vehicles/${id}`, { method: 'DELETE' });
                        this.fetchVehicles();
                        this.fetchStats();
                    } catch (e) { console.error(e); }
                },
                
                handleFileSelect(e) {
                    if (e.target.files.length) this.uploadImage(e.target.files[0]);
                },
                
                handleDrop(e) {
                    this.dragOver = false;
                    if (e.dataTransfer.files.length) this.uploadImage(e.dataTransfer.files[0]);
                },
                
                async uploadImage(file) {
                    if (!file.type.startsWith('image/')) {
                        alert(this.t('upload_img_only'));
                        return;
                    }
                    
                    this.isUploading = true;
                    this.uploadResult = null;
                    
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('cs_id', 'CS_TASHKENT_01');
                    formData.append('cp_id', 'CP01');
                    
                    try {
                        const res = await fetch('/api/v1/detect/upload', {
                            method: 'POST',
                            body: formData
                        });
                        this.uploadResult = await res.json();
                        
                        this.fetchStats();
                        this.fetchVehicles();
                    } catch (e) {
                        this.uploadResult = { success: false, message: 'Server communication error' };
                        console.error(e);
                    } finally {
                        this.isUploading = false;
                    }
                },

                openImageModal(url) {
                    if (!url) return;
                    this.previewImage = { open: true, url: url };
                },
                
                formatDate(dateStr) {
                    if (!dateStr) return '';
                    const d = new Date(dateStr);
                    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                },

                formatNote(item) {
                    if (!item) return '';
                    if (item.event_type === 'END') {
                        if (item.notes && item.notes.startsWith('Chiqish: ')) {
                            return item.notes.replace('Chiqish: ', '⏱️ ');
                        }
                        return item.notes ? '⏱️ ' + item.notes : '⏱️ Chiqish qayd etildi';
                    }
                    if (item.event_type === 'START') {
                        return '🚗 Kirish vaqti';
                    }
                    if (item.detection_source === 'CCTV_AUTO') {
                        return '📹 CCTV Avto';
                    }
                    if (item.detection_source === 'MANUAL_UPLOAD') {
                        return '📤 Qo\'lda tahlil';
                    }
                    return item.notes || '';
                }
            }));
        });
    </script>
