                        <div class="relative w-full h-full flex items-center justify-center bg-black overflow-hidden">
                            <template x-if="slot.is_online">
                                <img :src="'/api/v1/cameras/' + slot.camera_id + '/live'" 
                                     class="w-full h-full object-contain pointer-events-none"
                                     alt="Live CCTV Stream" />
                            </template>
                            <template x-if="!slot.is_online">
                                <div class="flex flex-col items-center justify-center text-slate-500 space-y-2">
                                    <i class="fa-solid fa-video-slash text-4xl text-slate-700"></i>
                                    <span class="text-xs font-mono font-bold uppercase tracking-wider" x-text="t('lbl_signal_lost')"></span>
                                </div>
                            </template>
                        </div>

                        <!-- Bottom Translucent Glassmorphic HUD with Live Plate, Battery & Action -->
                        <template x-if="slot.is_occupied || slot.is_charging || (slot.battery_soc && slot.battery_soc > 0) || (slot.charge_power_kw && slot.charge_power_kw > 0) || (slot.violation_type && slot.violation_type !== 'NONE' && slot.violation_type !== 'NORMAL_CHARGING')">
                            <div class="absolute bottom-0 left-0 right-0 p-2.5 sm:p-3 bg-gradient-to-t from-black/95 via-black/75 to-transparent backdrop-blur-[3px] text-white space-y-1.5 pointer-events-none">
                                <!-- Vehicle & Plate Info -->
                                <template x-if="slot.is_occupied">
                                    <div class="flex items-center justify-between flex-wrap gap-2">
                                        <div class="flex items-center space-x-2">
                                            <span class="px-2 py-0.5 rounded-lg bg-white text-slate-950 font-black font-mono text-xs sm:text-sm tracking-wider shadow-md" x-text="slot.current_plate || 'RAQAMSIZ'"></span>
                                            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold"
                                                  :class="slot.is_ev ? 'bg-sky-500/80 text-white' : 'bg-slate-700 text-slate-200'"
                                                  x-text="slot.is_ev ? t('vehicle_ev') : t('vehicle_regular')">
                                            </span>
                                        </div>
                                        <div class="text-right text-[11px] font-mono text-slate-300">
                                            <span x-text="t('lbl_parking_time') + ': ' + formatDurationDisplay(slot.occupied_duration)"></span>
                                        </div>
                                    </div>
                                </template>

                                <!-- Battery & Charging Telemetry (Strict CSMS DB) -->
                                <template x-if="slot.is_occupied || slot.is_charging || (slot.battery_soc && slot.battery_soc > 0) || (slot.charge_power_kw && slot.charge_power_kw > 0)">
                                    <div class="flex items-center justify-between text-xs pt-0.5 border-t border-white/10">
                                        <div class="flex items-center space-x-2">
                                            <template x-if="slot.battery_soc !== null && slot.battery_soc !== undefined && slot.battery_soc > 0">
                                                <div class="flex items-center space-x-1 font-mono font-bold text-sky-400">
                                                    <i class="fa-solid fa-bolt text-[10px] animate-pulse"></i>
                                                    <span x-text="slot.battery_soc + '%'"></span>
                                                    <span class="text-[10px] text-slate-300" x-show="slot.charge_power_kw && slot.charge_power_kw > 0" x-text="'(' + slot.charge_power_kw + ' kW)'"></span>

        function appData() {
            return {
                isDark: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches),
                currentLang: localStorage.getItem('app_lang') || 'ko',
                isMuted: localStorage.getItem('app_muted') === 'true',
                isRefreshing: false,
                knownAlertKeys: new Set(),

                stats: { total_detections: 0, ev_count: 0, regular_count: 0, today_detections: 0, today_ev: 0, today_regular: 0, today_alerts: 0 },
                slots: [],
                
                dragOver: false,
                isUploading: false,
                uploadResult: null,
                
                vehicles: [],
                totalVehicles: 0,
                page: 1,
                pageSize: 6,
                filters: {
                    type: '',
                    startDate: new Date().toISOString().slice(0, 10),
                    endDate: new Date().toISOString().slice(0, 10)
                },
                
                addCamModal: false,
                isProbingCam: false,
                probeResult: null,
                newCam: {
                    cs_id: 'bluenetwrks',
                    cp_id: 'BNS00000',
                    camera_name: '',
                    camera_type: 'RTSP',
                    brand: 'auto',
                    stream_url: '',
                    ip_address: '',
                    port: 554,
                    username: '',
                    password: '',
                    force_save: false,
                    is_active: true
                },

                liveModal: { open: false, slot: null, aiLoading: false, aiResult: null, aiError: null },
                previewImage: { open: false, url: '' },
                isSavingCam: false,
                
                tvWallModal: false,
                tvClock: '',
                tvClockInterval: null,
                isTvFullscreen: false,
                
                init() {
                    this.$watch('isDark', val => localStorage.setItem('theme', val ? 'dark' : 'light'));
                    this.fetchStats();
                    this.fetchSlots();
                    this.fetchVehicles();
                    
                    document.addEventListener('fullscreenchange', () => {
                        this.isTvFullscreen = !!document.fullscreenElement;
                    });
                    
                    // Live polling every 3s for real-time slot and detection updates
                    setInterval(() => {
                        this.fetchSlots();
                        this.fetchStats();
                        if (this.page === 1) this.fetchVehicles();
                    }, 3000);
                },

                t(key) {
                    const lang = this.currentLang || localStorage.getItem('app_lang') || 'ko';
                    const dict = (translations && translations[lang]) || (translations && translations.ko) || (translations && translations.uz) || {};
                    return dict[key] || key;
                },

                setLanguage(lang) {
                    this.currentLang = lang;
                    localStorage.setItem('app_lang', lang);
                },

                getConnectorLabel(slot) {
                    if (!slot) return '';
                    if (this.currentLang === 'ko') {
                        return slot.connector_status_kr || '사용 가능';
                    } else {
                        return slot.connector_status_uz || slot.connector_status_kr || "Mavjud (Bo'sh)";
                    }
                },

                getViolationLabel(slotOrItem) {
                    if (!slotOrItem) return '';
                    if (this.currentLang === 'ko') {
                        return slotOrItem.violation_label_kr || '정상';
                    } else {
                        return slotOrItem.violation_label_uz || slotOrItem.violation_label_kr || 'Normal';
                    }
                },

                getActionLabel(slotOrItem) {
                    if (!slotOrItem) return '—';
                    if (this.currentLang === 'ko') {
                        return slotOrItem.action_required_kr || slotOrItem.action_required || '—';
                    } else {
                        return slotOrItem.action_required_uz || slotOrItem.action_required || '—';
                    }
                },

                formatDurationDisplay(durationStr) {
                    if (!durationStr) return this.currentLang === 'ko' ? '0분' : '0 min';
                    if (this.currentLang === 'ko') {
                        return durationStr;
                    }
                    let str = durationStr.replace(/시간/g, ' soat').replace(/분/g, ' min').replace(/초/g, ' sek');
                    return str.trim();
                },
                
                toggleTheme() {
                    this.isDark = !this.isDark;
                },

                toggleSound() {
                    this.isMuted = !this.isMuted;
                    localStorage.setItem('app_muted', this.isMuted);
                    if (!this.isMuted) {
                        this.playAlarmSound();
                    }
                },

                playAlarmSound() {
                    if (this.isMuted) return;
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.3);
                    } catch (e) {}
                },
                
                async fetchStats() {
                    try {
                        const res = await fetch('/api/v1/stats/summary');
                        if (res.ok) this.stats = await res.json();
                    } catch (e) { console.error("Stats fetch error:", e); }
                },

                async fetchSlots() {
                    try {
                        const res = await fetch('/api/v1/cameras/slots-status');
                        if (res.ok) {
                            this.slots = await res.json();
                            let hasNewViolation = false;
                            for (const s of this.slots) {
                                if (s.is_occupied && s.violation_type && s.violation_type !== 'NONE' && s.violation_type !== 'NORMAL_CHARGING') {
                                    const alertKey = `${s.camera_id}_${s.session_id}_${s.violation_type}`;
                                    if (!this.knownAlertKeys.has(alertKey)) {
                                        this.knownAlertKeys.add(alertKey);
                                        hasNewViolation = true;
                                    }
                                }
                            }
                            if (hasNewViolation) {
                                this.playAlarmSound();
                            }
                        }
                    } catch (e) { console.error("Slots fetch error:", e); }
                },
                
                async fetchVehicles(manual = false) {
                    try {
                        if (manual) this.isRefreshing = true;
                        let url = `/api/v1/vehicles?page=${this.page}&page_size=${this.pageSize}`;
                        if (this.filters.type === 'EV') url += '&is_ev=true';
                        else if (this.filters.type === 'REGULAR') url += '&vehicle_type=REGULAR';
                        else if (this.filters.type === 'NON_EV') url += '&violation_filter=NON_EV';
                        else if (this.filters.type === 'NOT_CHARGING' || this.filters.type === 'OVERSTAY') url += '&is_ev=true';
                        
                        if (this.filters.startDate) url += `&start_date=${this.filters.startDate}`;
                        if (this.filters.endDate) url += `&end_date=${this.filters.endDate}`;
                        
                        const res = await fetch(url);
                        if (res.ok) {
                            const data = await res.json();
                            let items = data.items;
                            if (this.filters.type === 'NOT_CHARGING') {
                                items = items.filter(x => x.violation_type === 'NOT_CHARGING');
                            } else if (this.filters.type === 'OVERSTAY') {
                                items = items.filter(x => x.violation_type === 'OVERSTAY');
                            }
                            this.vehicles = items;
                            this.totalVehicles = data.total;
                        }
                    } catch (e) {
                        console.error("Vehicles fetch error:", e);
                    } finally {
                        if (manual) {
                            setTimeout(() => { this.isRefreshing = false; }, 300);
                        }
                    }
                },

                async refreshAll() {
                    this.isRefreshing = true;
                    await Promise.all([
                        this.fetchStats(),
                        this.fetchSlots(),
                        this.fetchVehicles(true)
                    ]);
                    setTimeout(() => { this.isRefreshing = false; }, 300);
                },

                exportCSV() {
                    let url = '/api/v1/vehicles/export?';
                    const params = [];
                    if (this.filters.type === 'EV') params.push('is_ev=true');
                    else if (this.filters.type === 'REGULAR') params.push('vehicle_type=REGULAR');
                    else if (this.filters.type === 'NON_EV') params.push('is_ev=false');
                    if (this.filters.startDate) params.push(`start_date=${this.filters.startDate}`);
                    if (this.filters.endDate) params.push(`end_date=${this.filters.endDate}`);
                    url += params.join('&');
                    window.location.href = url;
                },

                onBrandChange() {
                    const b = this.newCam.brand;
                    const ip = (this.newCam.ip_address || '192.168.0.16').trim();
                    if (b === 'hikvision') {
                        this.newCam.camera_type = 'RTSP';
                        this.newCam.port = 554;
                        this.newCam.stream_url = `rtsp://${ip}:554/Streaming/Channels/101`;
                    } else if (b === 'dahua') {
                        this.newCam.camera_type = 'RTSP';
                        this.newCam.port = 554;
                        this.newCam.stream_url = `rtsp://${ip}:554/cam/realmonitor?channel=1&subtype=0`;
                    } else if (b === 'hanwha') {
                        this.newCam.camera_type = 'RTSP';
                        this.newCam.port = 554;
                        this.newCam.stream_url = `rtsp://${ip}:554/profile2/media.smp`;
                    } else if (b === 'uniview') {
                        this.newCam.camera_type = 'RTSP';
                        this.newCam.port = 554;
                        this.newCam.stream_url = `rtsp://${ip}:554/unicast/c1/s0/live`;
                    } else if (b === 'tplink') {
                        this.newCam.camera_type = 'RTSP';
                        this.newCam.port = 554;
                        this.newCam.stream_url = `rtsp://${ip}:554/stream1`;
                    } else if (b === 'axis') {
                        this.newCam.camera_type = 'RTSP';
                        this.newCam.port = 554;
                        this.newCam.stream_url = `rtsp://${ip}:554/axis-media/media.amp`;
                    } else if (b === 'http') {
                        this.newCam.camera_type = 'HTTP_SNAPSHOT';
                        this.newCam.port = 80;
                        this.newCam.stream_url = `http://${ip}:80/snapshot.jpg`;
                    } else {
                        this.newCam.camera_type = 'RTSP';
                        this.newCam.port = 554;
                        this.newCam.stream_url = '';
                    }
                    this.probeResult = null;
                },

                async testProbeCamera() {
                    if (!this.newCam.ip_address && !this.newCam.stream_url) {
                        alert(this.currentLang === 'uz' ? "IP manzilni kiriting." : "IP 주소를 입력해주세요.");
                        return;
                    }
                    this.isProbingCam = true;
                    this.probeResult = null;
                    try {
                        const payload = {
                            ip_address: this.newCam.ip_address,
                            port: this.newCam.port || 554,
                            camera_type: this.newCam.camera_type,
                            stream_url: this.newCam.stream_url,
                            username: this.newCam.username,
                            password: this.newCam.password,
                            brand: this.newCam.brand
                        };
                        const res = await fetch('/api/v1/cameras/probe', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        this.probeResult = data;
                        if (data.success && data.working_stream_url) {
                            this.newCam.stream_url = data.working_stream_url;
                            if (data.camera_type) this.newCam.camera_type = data.camera_type;
                        }
                    } catch (e) {
                        this.probeResult = {
                            success: false,
                            message: (this.currentLang === 'uz' ? "Ulanish xatosi: " : "연결 오류: ") + e.message
                        };
                    } finally {
                        this.isProbingCam = false;
                    }
                },

                async createCamera() {
                    let timeoutId = null;
                    try {
                        this.isSavingCam = true;
                        if (!this.newCam.port) {
                            this.newCam.port = this.newCam.camera_type === 'HTTP_SNAPSHOT' ? 80 : 554;
                        }
                        const controller = new AbortController();
                        timeoutId = setTimeout(() => controller.abort(), 25000);
                        const res = await fetch('/api/v1/cameras', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.newCam),
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        if (res.ok) {
                            await this.fetchSlots();
                            this.addCamModal = false;
                            this.newCam = {
                                cs_id: 'bluenetwrks', cp_id: 'BNS00000',
                                camera_name: '', camera_type: 'RTSP', brand: 'auto', stream_url: '',
                                ip_address: '', port: 554, username: '', password: '', force_save: false, is_active: true
                            };
                            this.probeResult = null;
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            const msg = errData.detail || "카메라 연결에 실패했습니다. IP, 아이디, 비밀번호를 확인해주세요.";
                            alert("❌ " + msg);
                        }
                    } catch (e) {
                        console.error("Create camera error:", e);
                        if (e.name === 'AbortError') {
                            alert("❌ " + (this.currentLang === 'uz' ? "Ulanish vaqti tugadi (Timeout). IP manzil yoki parolni tekshiring." : "연결 시간 초과되었습니다. IP 또는 비밀번호를 확인해주세요."));
                        } else {
                            alert("❌ " + (this.currentLang === 'uz' ? "Ulanish xatosi: " : "연결 오류: ") + e.message);
                        }
                    } finally {
                        if (timeoutId) clearTimeout(timeoutId);
                        this.isSavingCam = false;
                    }
                },

                openLiveModal(slot) {
                    this.liveModal = {
                        open: true,
                        slot: slot,
                        aiLoading: false,
                        aiResult: null,
                        aiError: null
                    };
                },

                closeLiveModal() {
                    this.liveModal = {
                        open: false,
                        slot: null,
                        aiLoading: false,
                        aiResult: null,
                        aiError: null
                    };
                },

                async scanLiveFrame() {
                    if (!this.liveModal.slot) return;
                    this.liveModal.aiLoading = true;
                    this.liveModal.aiResult = null;
                    this.liveModal.aiError = null;
                    try {
                        const res = await fetch(`/api/v1/cameras/${this.liveModal.slot.camera_id}/test`, { method: 'POST' });
                        const data = await res.json();
                        if (data.success && data.image_base64) {
                            const byteCharacters = atob(data.image_base64);
                            const byteNumbers = new Array(byteCharacters.length);
                            for (let i = 0; i < byteCharacters.length; i++) {
                                byteNumbers[i] = byteCharacters.charCodeAt(i);
                            }
                            const byteArray = new Uint8Array(byteNumbers);
                            const blob = new Blob([byteArray], { type: 'image/jpeg' });
                            
                            const formData = new FormData();
                            formData.append('file', blob, 'cctv_live_snap.jpg');
                            formData.append('cs_id', this.liveModal.slot.cs_id || 'bluenetwrks');
                            formData.append('cp_id', this.liveModal.slot.cp_id || 'BNS00000');
                            
                            const detRes = await fetch('/api/v1/detect/upload', {
                                method: 'POST',
                                body: formData
                            });
                            this.liveModal.aiLoading = false;
                            if (detRes.ok) {
                                const json = await detRes.json();
                                if (json.success && json.data) {
                                    this.liveModal.aiResult = { ...json.data, success: true };
                                } else {
                                    this.liveModal.aiResult = { success: false, message: json.message || 'Raqam aniqlanmadi' };
                                }
                                this.fetchStats();
                                this.fetchVehicles();
                                this.fetchSlots();
                            } else {
                                this.liveModal.aiError = 'AI tahlil xatosi yuz berdi';
                            }
                        } else {
                            this.liveModal.aiLoading = false;
                            this.liveModal.aiError = data.message || "Kameradan kadr olib bo'lmadi";
                        }
                    } catch (e) {
                        this.liveModal.aiLoading = false;
                        this.liveModal.aiError = 'Kamera bilan aloqa xatosi: ' + e;
                    }
                },

                async deleteCamera(id) {
                    if (!confirm(this.t('confirm_delete_cam'))) return;
                    try {
                        await fetch(`/api/v1/cameras/${id}`, { method: 'DELETE' });
                        this.fetchSlots();
                    } catch (e) { console.error(e); }
                },
                
                get totalPages() {
                    return Math.ceil(this.totalVehicles / this.pageSize) || 1;
                },
                
                prevPage() {
                    if (this.page > 1) { this.page--; this.fetchVehicles(); }
                },
                
                nextPage() {
                    if (this.page < this.totalPages) { this.page++; this.fetchVehicles(); }
                },
                
                async deleteVehicle(id) {
                    if (!confirm(this.t('confirm_delete_vehicle'))) return;
                    try {
                        await fetch(`/api/v1/vehicles/${id}`, { method: 'DELETE' });
                        this.fetchVehicles();
                        this.fetchStats();
                        this.fetchSlots();
                    } catch (e) { console.error(e); }
                },
                
                handleFileSelect(e) {
                    if (e.target.files.length) this.uploadImage(e.target.files[0]);
                },
                
                handleDrop(e) {
                    this.dragOver = false;
                    if (e.dataTransfer.files.length) this.uploadImage(e.dataTransfer.files[0]);
                },
                
                async uploadImage(file) {
                    if (!file.type.startsWith('image/')) {
                        alert(this.t('upload_img_only'));
                        return;
                    }
                    
                    this.isUploading = true;
                    this.uploadResult = null;
                    
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('cs_id', 'bluenetwrks');
                    formData.append('cp_id', 'BNS00000');
                    
                    try {
                        const res = await fetch('/api/v1/detect/upload', {
                            method: 'POST',
                            body: formData
                        });
                        this.uploadResult = await res.json();
                        
                        this.fetchStats();
                        this.fetchVehicles();
                        this.fetchSlots();
                    } catch (e) {
                        this.uploadResult = { success: false, message: 'Server communication error' };
                        console.error(e);
                    } finally {
                        this.isUploading = false;
                    }
                },

                openImageModal(url) {
                    if (!url) return;
                    this.previewImage = { open: true, url: url };
                },
                
                formatDate(dateStr) {
                    if (!dateStr) return '';
                    const d = new Date(dateStr.includes('T') ? dateStr : dateStr.replace(' ', 'T'));
                    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                },

                formatDurationText(text) {
                    if (!text) return '';
                    if (this.currentLang !== 'ko') {
                        return text.replace(/^Chiqish:\s*/i, '').trim();
                    }
                    let t = text.replace(/^Chiqish:\s*/i, '');
                    t = t.replace(/Jami\s*/gi, '총 ');
                    t = t.replace(/(\d+)\s*soat/gi, '$1시간 ');
                    t = t.replace(/(\d+)\s*daqiqa/gi, '$1분 ');
                    t = t.replace(/(\d+)\s*soniya/gi, '$1초');
                    t = t.replace(/to['’]xtab turdi/gi, '주차');
                    return t.trim();
                },

                formatNote(item) {
                    if (!item) return '';
                    if (item.event_type === 'END') {
                        if (item.notes) {
                            return '⏱️ ' + this.formatDurationText(item.notes);
                        }
                        return this.t('note_exit');
                    }
                    if (item.event_type === 'START') {
                        return this.t('note_entry');
                    }
                    if (item.detection_source === 'CCTV_AUTO') {
                        return this.t('note_cctv_auto');
                    }
                    if (item.detection_source === 'MANUAL_UPLOAD') {
                        return this.t('note_manual_upload');
                    }
                    return item.notes || '';
                },

                openTvWall() {
                    this.tvWallModal = true;
                    this.updateTvClock();
                    if (this.tvClockInterval) clearInterval(this.tvClockInterval);
                    this.tvClockInterval = setInterval(() => this.updateTvClock(), 1000);
                },

                closeTvWall() {
                    this.tvWallModal = false;
                    if (this.tvClockInterval) {
                        clearInterval(this.tvClockInterval);
                        this.tvClockInterval = null;
                    }
                    if (document.fullscreenElement) {
                        document.exitFullscreen().catch(() => {});
                        this.isTvFullscreen = false;
                    }
                },

                updateTvClock() {
                    const now = new Date();
                    this.tvClock = now.toLocaleTimeString(this.currentLang === 'ko' ? 'ko-KR' : 'uz-UZ', { hour12: false });
                },

                toggleTvFullscreen() {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then(() => {
                            this.isTvFullscreen = true;
                        }).catch(err => {
                            console.log("Fullscreen request:", err);
                        });
                    } else {
                        document.exitFullscreen().then(() => {
                            this.isTvFullscreen = false;
                        }).catch(() => {});
                    }
                },

                getTvGridClass() {
                    const count = (this.slots && this.slots.length) ? this.slots.length : 0;
                    if (count <= 1) {
                        return 'grid grid-cols-1 grid-rows-1 gap-2 sm:gap-3 h-full w-full';
                    }
                    if (count === 2) {
                        return 'grid grid-cols-1 md:grid-cols-2 grid-rows-1 gap-2 sm:gap-3 h-full w-full';
                    }
                    if (count <= 4) {
                        return 'grid grid-cols-2 grid-rows-2 gap-2 sm:gap-3 h-full w-full';
                    }
                    if (count <= 6) {
                        return 'grid grid-cols-3 grid-rows-2 gap-2 sm:gap-3 h-full w-full';
                    }
                    return 'grid grid-cols-4 grid-rows-2 gap-2 sm:gap-3 h-full w-full';
                }
            };
        }

        window.appData = appData;
        window.translations = translations;
        window.t = function(key) {
            const lang = localStorage.getItem('app_lang') || 'ko';
            const dict = (translations && translations[lang]) || (translations && translations.ko) || {};
            return dict[key] || key;
        };

        document.addEventListener('alpine:init', () => {
            Alpine.data('appData', appData);
        });
    </script>
</body>
</html>
